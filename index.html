<title>鳥一代グループ 日報・週報システム</title>
<style>

  .app{max-width:480px;margin:0 auto;min-height:100vh;background:#fff;padding-bottom:calc(80px + env(safe-area-inset-bottom))}
  header{position:sticky;top:0;background:var(--blue);color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;z-index:10}
  header b{font-size:15px}
  main{padding:16px}

  .card h3{margin:0 0 8px;font-size:14px}

  .btn.sub{background:#fff;color:var(--blue);border:1px solid var(--blue)}
  .btn.sm{width:auto;display:inline-block;padding:7px 14px;font-size:13px;margin:4px 4px 0 0}
  .btn:disabled{opacity:.5}
  .chip{display:inline-block;border:1px solid var(--blue);color:var(--blue);border-radius:16px;padding:6px 14px;font-size:13px;margin:3px;cursor:pointer;user-select:none}
  .chip.on{background:var(--blue);color:#fff}
  .stars span{font-size:26px;color:#ccc;cursor:pointer;margin-right:4px}
  .stars span.on{color:#e8b400}
  textarea,input[type=text],input[type=email],input[type=password],input[type=date],input[type=datetime-local],select.inp{width:100%;border:1px solid #bbb;border-radius:8px;padding:10px;font-size:16px;margin-top:6px;font-family:inherit;background:#fff;color:inherit}
  .alert{background:#fdecec;color:var(--red);border-radius:8px;padding:10px;font-size:13px;margin-bottom:10px}
  .tbl{width:100%;font-size:13px;border-collapse:collapse}
  .tbl td{padding:5px 0;border-bottom:1px solid #f0f2f5}
  .tbl td:last-child{text-align:right}
  .tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .tblwrap .tbl{min-width:430px}
  .crow{display:flex;gap:10px;align-items:center;padding:10px 4px;border-bottom:1px solid #f0f2f5;cursor:pointer}

  .cava.sm{width:28px;height:28px;font-size:12px;background:#8fb6dd;color:#fff;align-self:flex-end}
  .cell1{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cdate{text-align:center;margin:14px 0 4px}

  .cbwrap{display:flex;gap:6px;margin:8px 0}
  .cbwrap.mine{flex-direction:row-reverse}
  .cb{background:#fff;border:1px solid #e3e7ee;border-radius:14px 14px 14px 4px;padding:8px 11px;font-size:14px;text-align:left;word-break:break-word;max-width:100%}
  .cbwrap.mine .cb{background:#d9edff;border-color:#c9e2f6;border-radius:14px 14px 4px 14px}
  .cact{margin:3px 0 0;display:none}
  .cquote{border-left:3px solid #9db8d4;background:#eef2f7;color:#5a6675;font-size:11px;padding:3px 8px;border-radius:6px;margin-bottom:4px;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
  .cact button{border:1px solid #d5dbe3;background:#fff;border-radius:8px;font-size:11px;padding:3px 8px;margin:0 4px 0 0;cursor:pointer}
  .info{background:#eaf3fd;color:#1a5c9e;border-radius:8px;padding:10px;font-size:13px;margin-bottom:10px}
  .muted{color:#8a93a2;font-size:12px}
  .row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:11px 4px;border-bottom:1px solid #f0f2f5;cursor:pointer;font-size:14px}
  .row>span:first-child{min-width:0;word-break:break-word}
  .badge{background:var(--red);color:#fff;border-radius:10px;font-size:11px;padding:2px 8px}
  .badge.g{background:var(--green)}
  .badge.b{background:var(--blue)}
  nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;max-width:480px;margin:0 auto;padding-bottom:env(safe-area-inset-bottom)}
  nav button{flex:1;border:none;background:none;padding:10px 0 14px;font-size:11px;color:#8a93a2;cursor:pointer}
  nav button.on{color:var(--blue);font-weight:600}
  nav button i{display:block;font-size:20px;font-style:normal}
  .req{color:var(--red);font-size:12px}
  h2{font-size:17px;margin:4px 0 12px}
  .back{color:var(--blue);font-size:13px;cursor:pointer;margin-bottom:8px;display:inline-block}
  .cmt{background:#f6f8fa;border-radius:8px;padding:8px 10px;margin-top:6px;font-size:13px}
  .seg{display:flex;border:1px solid var(--blue);border-radius:8px;overflow:hidden;margin-bottom:12px}
  .seg div{flex:1;text-align:center;padding:8px;font-size:13px;color:var(--blue);cursor:pointer}
  .seg div.on{background:var(--blue);color:#fff}
  .loginwrap{padding:40px 24px}
  .center{text-align:center}
  .spin{padding:40px;text-align:center;color:#8a93a2}
  nav button{position:relative}
  .ndot{position:absolute;top:2px;right:12px;background:var(--red);color:#fff;font-size:10px;min-width:16px;height:16px;line-height:16px;border-radius:8px;padding:0 4px;text-align:center}

  .radio-row{display:block;padding:9px 12px;border:1px solid var(--line);border-radius:8px;margin-top:6px;cursor:pointer;font-size:14px}
  .radio-row input{margin-right:8px}
  .photo-grid{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}

  .photo-grid .ph img{width:100%;height:100%;object-fit:cover}
  .photo-grid .ph .del{position:absolute;top:2px;right:2px;background:rgba(0,0,0,.55);color:#fff;border-radius:50%;width:20px;height:20px;line-height:20px;text-align:center;font-size:12px;cursor:pointer}
  .addph{width:84px;height:84px;border:2px dashed #bbb;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#8a93a2;font-size:26px;cursor:pointer}
  /* v1.6 フォームデザイナー */
  .fhandle{cursor:grab;color:#8a93a2;font-size:18px;padding:0 6px;user-select:none}
  .fnum{display:inline-block;background:#eaf3fd;color:var(--blue);border-radius:6px;font-size:12px;padding:2px 8px;font-weight:600}
  .dragover{outline:2px solid var(--blue);outline-offset:-2px}
  /* レスポンシブ: 小さいスマホ（〜379px）はナビ文字を少し縮小 */
  @media(max-width:379px){
   nav button{font-size:10px}
   nav button i{font-size:18px}
   main{padding:14px 12px}
  }
  /* レスポンシブ: タブレット・中間幅（600〜899px）は本体を少し広く */
  @media(min-width:600px) and (max-width:899px){
   .app,nav{max-width:640px}
  }
  /* v1.6 PC 2カラムレイアウト */
  @media(min-width:900px){
   body.withnav .app{max-width:940px;margin:0 0 0 calc(max(0px, 50vw - 590px) + 240px);border-left:1px solid var(--line);border-right:1px solid var(--line);padding-bottom:24px}
   body.withnav nav{top:0;bottom:0;right:auto;left:max(0px, 50vw - 590px);width:240px;max-width:240px;flex-direction:column;justify-content:flex-start;border-top:none;border-right:1px solid var(--line);padding-top:14px}
   body.withnav nav:before{content:"🐔 鳥一代グループ";display:block;font-weight:700;font-size:15px;color:var(--blue);padding:10px 20px 18px}
   body.withnav nav button{flex:0 0 auto;display:flex;align-items:center;gap:12px;padding:14px 20px;font-size:15px;text-align:left}
   body.withnav nav button i{display:inline-block;font-size:20px}
   body.withnav nav button.on{background:#eaf3fd}
   body.withnav .ndot{position:static;margin-left:auto}
   body.withnav main{padding:24px 36px}
   body.withnav header{padding:14px 36px}
   .loginwrap{max-width:480px;margin:0 auto}
  }
</style>
</head>

function rcAge(a){
 const an=(a&&a.answers)||{};
 const bk=Object.keys(an).find(k=>/生年月日|birth/i.test(k));
 if(bk){
  const m=String(an[bk]||"").match(/(\d{4})\s*[\/\-年.]\s*(\d{1,2})\s*[\/\-月.]\s*(\d{1,2})/);
  if(m){
   const y=+m[1],mo=+m[2],d=+m[3],now=new Date();
   let age=now.getFullYear()-y;
   if(now.getMonth()+1<mo||(now.getMonth()+1===mo&&now.getDate()<d))age--;
   if(age>=0&&age<120)return age;
  }
 }
 const ak=Object.keys(an).find(k=>/^(※\s*)?年齢$/.test(k.trim()));
 if(ak){const n=parseInt(String(an[ak]).replace(/[^0-9]/g,""),10);if(n>0&&n<120)return n}
 return null;
}

 return "";

function friendlyErr(s){

 if(/row-level security|permission denied|insufficient privilege/i.test(t))return "権限がないため保存できませんでした。本部にお問い合わせください";
 if(/duplicate key|already exists|unique constraint/i.test(t))return "同じ内容がすでに登録されています";
 if(/Failed to fetch|NetworkError|network|timeout/i.test(t))return "通信エラーです。電波の良い場所でもう一度お試しください";
 if(/JWT|token is expired|invalid claim/i.test(t))return "ログインの有効期限が切れました。一度ログインし直してください";
 if(/violates foreign key/i.test(t))return "関連するデータが見つかりませんでした。画面を再読み込みしてお試しください";
 if(/value too long/i.test(t))return "入力が長すぎます。文字数を減らしてお試しください";
 return t;
}

// v2.6.23 郵便番号を入れたら住所を自動で入れる（zipcloud・無料/登録不要）
// 住所欄がすでに埋まっているときは上書きしない（本人が書いた番地を消さないため）
function bindZip(zipId,addrId){
 const z=$(zipId),a=$(addrId);
 if(!z||!a)return;
 let last="";
 const look=async()=>{
  const code=z.value.replace(/[^0-9]/g,"");
  if(code.length!==7||code===last)return;
  last=code;
  try{
   const res=await fetch("https://zipcloud.ibsnet.co.jp/api/search?zipcode="+code);
   const j=await res.json();
   const r=j&&j.results&&j.results[0];
   if(!r){toast("この郵便番号の住所が見つかりませんでした",true);return}
   const base=(r.address1||"")+(r.address2||"")+(r.address3||"");
   if(!a.value.trim()){a.value=base;toast("住所を自動で入れました。続けて番地・建物名をご入力ください")}
   else if(!a.value.startsWith(base))toast("住所がすでに入力されています（自動入力していません）");
  }catch(e){ /* つながらないときは何もしない（手入力できるため） */ }
 };
 z.oninput=look; z.onblur=look;
}

function bindDrag(handleSel,cardSel,key,getList,collect){
 let di=null;
 document.querySelectorAll(handleSel).forEach(hd=>{
  hd.ondragstart=e=>{di=+hd.dataset[key];e.dataTransfer.effectAllowed="move"};
 });
 document.querySelectorAll(cardSel).forEach(cd=>{
  cd.ondragover=e=>{e.preventDefault();cd.classList.add("dragover")};
  cd.ondragleave=()=>cd.classList.remove("dragover");
  cd.ondrop=e=>{
   e.preventDefault();cd.classList.remove("dragover");
   const to=+cd.dataset[key];
   if(di==null||isNaN(to)||di===to)return;
   collect();const l=getList();const [m]=l.splice(di,1);l.splice(to,0,m);di=null;render();
  };
 });
}

function joinPick(ans,pats,exclude){
 if(!ans||typeof ans!=="object")return "";
 const keys=Object.keys(ans);
 for(const p of pats){
  for(const k of keys){
   if(!k.includes(p))continue;
   if(exclude&&exclude.some(x=>k.includes(x)))continue;
   const v=ans[k];
   if(v==null||v===""||(Array.isArray(v)&&!v.length))continue;
   return Array.isArray(v)?v.join("、"):String(v);
  }
 }
 return "";
}

// v2.6.28 一覧タブの赤バッジ＝直近7日で「まだ読んでいない／読んだ後に修正された」日報・週報の数
// 通知の件数ではなく一覧の🔵と同じ条件で数えるので、SQL未適用でもそのまま動く
const LIST_UNREAD_DAYS=7;
async function listUnreadCount(){
 try{
  const since=new Date(Date.now()-LIST_UNREAD_DAYS*864e5).toISOString().slice(0,10);
  const {data:rs}=await sb.from("reports").select("id,updated_at").gte("report_date",since).neq("author_id",me.id).limit(500);
  if(!rs||!rs.length)return 0;
  const {data:reads}=await sb.from("report_reads").select("report_id,created_at").eq("user_id",me.id).in("report_id",rs.map(r=>r.id));
  const readAt={};(reads||[]).forEach(x=>readAt[x.report_id]=x.created_at);
  return rs.filter(r=>isUnread(r,readAt[r.id])).length;
 }catch(e){return 0}
}
// 未読の判定: まだ読んでいない or 読んだ後に修正された（時刻は日時に直して比べる）
function isUnread(r,read){
 if(!read)return true;
 if(!r.updated_at)return false;
 return new Date(r.updated_at).getTime()>new Date(read).getTime();
}

// ===== v2.6.22 画面の履歴（ブラウザの←ボタン・スマホの右スワイプに対応） =====
// 画面の状態をブラウザの履歴に積んでおき、戻る操作で元の状態に復元する。
// ※ ここの変数は let 宣言のため window に生えない。明示的に読み書きする
function navSnapshot(){
 return {page,detail,editId,adminMode,adminDetail,setMode,rcDetail,rcJobs,chatRoom,chatNew,ckAdminMode};
}
function navApply(st){
 page=st.page;detail=st.detail;editId=st.editId;adminMode=st.adminMode;adminDetail=st.adminDetail;
 setMode=st.setMode;rcDetail=st.rcDetail;rcJobs=st.rcJobs;chatRoom=st.chatRoom;chatNew=st.chatNew;
 ckAdminMode=st.ckAdminMode;
}
let navLast=null,navStack=[],navSkipPop=false;
function navSync(){
 const cur=navSnapshot(),j=JSON.stringify(cur);
 if(navLast===null){history.replaceState({nav:cur},"");navLast=j;navStack=[j];return}
 if(j===navLast)return;
 // アプリ内の「← 戻る」で1つ前の画面に戻ったときは、履歴も1つ戻す
 // （そうしないと履歴が増え続け、ブラウザの戻るで画面が進んでしまう）
 if(navStack.length>=2&&navStack[navStack.length-2]===j){
  navStack.pop();navLast=j;navSkipPop=true;history.back();return;
 }
 navStack.push(j);history.pushState({nav:cur},"");navLast=j;
}
window.addEventListener("popstate",e=>{
 if(navSkipPop){navSkipPop=false;return} // 上のhistory.back()による分は無視
 if(!e.state||!e.state.nav||!me)return;  // ログイン前などは何もしない
 navApply(e.state.nav);
 navLast=JSON.stringify(navSnapshot());
 if(navStack.length>1)navStack.pop();
 rcMsgs=null;
 render();
});

function reportToText(rp){

  let s;
  if(f.type==="stars")s="★".repeat(+v||0)+"☆".repeat(Math.max(0,5-(+v||0)));
  else if(f.type==="num")s=v+"点";

  s=s.trim();if(!s)return;
  t+=`\n\n【${f.label}】\n${s.length>400?s.slice(0,400)+"…":s}`;
 });
 return t;
}

 if(!mm||!mm.length)return 0;
 const minRead=mm.map(m=>m.last_read_at).sort()[0];
 const {data:ms}=await sb.from("messages").select("room_id,created_at,sender_id").in("room_id",mm.map(m=>m.room_id)).gt("created_at",minRead).neq("sender_id",me.id).neq("kind","deleted").order("created_at",{ascending:false}).limit(300);

const DPERIODS={today:"今日",d7:"直近7日",d30:"直近30日",year:"今年"};

function dashRange(){ // [開始Date, 終了Date]

 if(dashPeriod==="year")return [new Date(now.getFullYear(),0,1),now];
 if(dashPeriod==="today"){const t=new Date();t.setHours(0,0,0,0);return [t,now]}
 return [new Date(now.getTime()-(dashPeriod==="d7"?7:30)*864e5),now];
}

// v2.6.20 LINE連携のEdge Functionを呼ぶ
async function lineFn(body){
 try{
  const {data:{session}}=await sb.auth.getSession();
  const res=await fetch(SUPA_URL+"/functions/v1/line-webhook",{method:"POST",
   headers:{Authorization:"Bearer "+(session?session.access_token:SUPA_KEY),apikey:SUPA_KEY,"Content-Type":"application/json"},
   body:JSON.stringify(body)});
  const j=await res.json().catch(()=>({}));
  if(!res.ok&&!j.error)j.error=res.status===404?"LINE連携の受け口（line-webhook）がまだ作られていません。Supabaseで作成してください":"サーバーの応答: "+res.status;
  return j;

// ===== v2.6.5 CSV取り込み =====
function parseCsv(text){
 const rows=[];let cur=[],val="",q=false;
 text=String(text||"").replace(/^\uFEFF/,"");
 for(let i=0;i<text.length;i++){
  const c=text[i];
  if(q){ if(c==='"'){ if(text[i+1]==='"'){val+='"';i++} else q=false } else val+=c }
  else if(c==='"')q=true;
  else if(c===","){cur.push(val);val=""}
  else if(c==="\n"){cur.push(val);rows.push(cur);cur=[];val=""}
  else if(c!=="\r")val+=c;
 }
 if(val!==""||cur.length){cur.push(val);rows.push(cur)}
 return rows.filter(r=>r.some(x=>String(x).trim()));
}
function csvPhone(s){ // '+81 70 1234 5678 → 070-1234-5678（海外番号はそのまま）
 let t=String(s||"").replace(/^'/,"").trim();
 if(!t)return "";
 const d=t.replace(/[^0-9]/g,"");
 if(/^81/.test(d)&&d.length>=11){
  const n="0"+d.slice(2);
  if(n.length===11)return n.slice(0,3)+"-"+n.slice(3,7)+"-"+n.slice(7);
  if(n.length===10)return n.slice(0,2)+"-"+n.slice(2,6)+"-"+n.slice(6);
  return n;
 }
 return t.replace(/\s+/g," ");
}
const csvNormName=s=>String(s||"").replace(/[\s　]/g,"").toLowerCase();
const csvNormPhone=s=>{const d=String(s||"").replace(/[^0-9]/g,"");return /^81/.test(d)&&d.length>=11?"0"+d.slice(2):d};

   const head=rows[0].map(h=>String(h).trim());
   const col=(...names)=>{for(const n of names){const i=head.findIndex(h=>h.includes(n));if(i>=0)return i}return -1};
   const ix={name:col("名前","氏名"),email:col("メール"),phone:col("電話"),status:col("ステータス"),
    address:col("居住地","住所"),exp:col("関連のある経験","経験"),edu:col("学歴"),
    job:col("職種"),loc:col("勤務地"),date:col("日付","応募日"),src:col("応募経路","経路")};
   if(ix.name<0){toast("「名前」の列が見つかりません。IndeedのCSVかご確認ください",true);return}
   const g=(r,i)=>i>=0?String(r[i]||"").trim():"";
   const byPhone={},byName={},byMail={};
   (rcList||[]).forEach(a=>{
    const p=csvNormPhone(a.phone);if(p&&!byPhone[p])byPhone[p]=a;
    const n=csvNormName(a.name);if(n&&!byName[n])byName[n]=a;
    const m=(a.email||"").toLowerCase();if(m&&!byMail[m])byMail[m]=a;
   });

    const name=g(r,ix.name);if(!name)return;

 const saveTerm=async(d)=>{
  const btn=$(d?"eu-termsave":"eu-termclear");if(btn)btn.disabled=true;
  const {data,error}=await sb.rpc("set_employee_termination",{p_user:adminDetail,p_date:d});
  if(error){toast("保存エラー: "+error.message,true);if(btn)btn.disabled=false;return}
  let sm="";
  try{
   const r=await smaregiTerminate(adminDetail,d);
   sm=r&&r.ok?(r.skipped?"（スマレジは未連携）":"／スマレジにも反映しました"):"／スマレジ反映に失敗（後で再実行してください）";
  }catch(e){sm="／スマレジ反映に失敗"}
  const apps=(data&&data.applicants)||0;
  toast(d?`退職日を保存しました${apps?"／応募者の状況を退職に更新":""}${sm}`:`退職を取り消しました${sm}`);
  adminMode="list";adminDetail=null;adminUsers=null;rcList=null;rcHiredInfo=null;render();
 };

  if(!confirm(`退職日を ${d} に設定します。\n\n・アカウントが使えなくなります\n・スマレジ・タイムカードにも登録され、打刻できなくなります\n・応募者管理の状況が「退職」になります\n\nよろしいですか？`))return;
  saveTerm(d);
 };

  saveTerm(null);
 };

 if($("eu-del"))$("eu-del").onclick=async()=>{
  const {data:info,error}=await sb.rpc("delete_user_completely",{p_user:adminDetail,p_confirm:false});
  if(error){toast("エラー: "+error.message,true);return}
  const n=[["日報",info.reports],["フィードバック",info.comments],["タスク",info.tasks],["タスクのコメント",info.task_comments],["チャット発言",info.messages],["添付ファイル",info.files]].filter(x=>x[1]>0);
  const detail=n.length?"\n\n一緒に削除されるもの:\n"+n.map(x=>`・${x[0]} ${x[1]}件`).join("\n"):"\n\n（関連データはありません）";
  if(!confirm(`${info.name}さんを完全に削除します。元に戻せません。${detail}\n\n本当に削除しますか？`))return;
  if(n.length&&!confirm(`最終確認です。\n${info.name}さんの記録もすべて消えます。よろしいですか？`))return;
  $("eu-del").disabled=true;
  const {data:res,error:e2}=await sb.rpc("delete_user_completely",{p_user:adminDetail,p_confirm:true});
  if(e2){toast("削除エラー: "+e2.message,true);$("eu-del").disabled=false;return}
  toast(`${(res&&res.name)||""}さんを完全に削除しました`);
  adminMode="list";adminDetail=null;adminUsers=null;render();
 };

  if(pw!==pw2){toast("確認用のパスワードが一致しません",true);return}
  $("pf-pwsave").disabled=true;
  const {error}=await sb.auth.updateUser({password:pw});

  if(error){toast("変更エラー: "+error.message,true);return}
  $("pf-pw").value="";$("pf-pw2").value="";toast("パスワードを変更しました");
 };
