<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>鳥一代グループ 日報・週報システム</title>
<style>
  :root{--blue:#2b6cb0;--bg:#f2f4f7;--line:#dde3ea;--red:#c0392b;--green:#1e8e5a}
  /* A-5(2026-08-29) シフト管理だけ、確定モックアップ（docs/mockups/NStyle_シフト管理_UI_v5.html）の
     配色（テラコッタ系アクセント・暖色の背景）に寄せる妥協案。専用サイドバー・ロゴは共通シェル
     （12項目ボトムナビ・共通ヘッダー）を維持するため見送り、CSS変数の上書きだけで実現する */
  .sf-theme{--blue:#c94728;--bg:#f4f1eb;background:var(--bg);padding:10px;border-radius:14px;margin:0 -2px}
  *{box-sizing:border-box}
  body{font-family:-apple-system,"Hiragino Sans",sans-serif;background:var(--bg);margin:0;color:#2d3340;font-size:15px}
  .app{max-width:480px;margin:0 auto;min-height:100vh;background:#fff;padding-bottom:calc(80px + env(safe-area-inset-bottom))}
  header{position:sticky;top:0;background:var(--blue);color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;z-index:10}
  header b{font-size:15px}
  main{padding:16px}
  .card{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px;background:#fff}
  .card h3{margin:0 0 8px;font-size:14px}
  .btn{display:block;width:100%;background:var(--blue);color:#fff;border:none;border-radius:10px;padding:13px;font-size:15px;text-align:center;cursor:pointer;margin-top:8px}
  .btn.sub{background:#fff;color:var(--blue);border:1px solid var(--blue)}
  .btn.sm{width:auto;display:inline-block;padding:7px 14px;font-size:13px;margin:4px 4px 0 0}
  .btn:disabled{opacity:.5}
  .chip{display:inline-block;border:1px solid var(--blue);color:var(--blue);border-radius:16px;padding:6px 14px;font-size:13px;margin:3px;cursor:pointer;user-select:none}
  .chip.on{background:var(--blue);color:#fff}
  .stars span{font-size:26px;color:#ccc;cursor:pointer;margin-right:4px}
  .stars span.on{color:#e8b400}
  textarea,input[type=text],input[type=email],input[type=password],input[type=date],input[type=datetime-local],select.inp{width:100%;border:1px solid #bbb;border-radius:8px;padding:10px;font-size:16px;margin-top:6px;font-family:inherit;background:#fff;color:inherit}
  .alert{background:#fdecec;color:var(--red);border-radius:8px;padding:10px;font-size:13px;margin-bottom:10px}
  .tbl{width:100%;font-size:13px;border-collapse:collapse}
  .tbl td{padding:5px 0;border-bottom:1px solid #f0f2f5}
  .tbl td:last-child{text-align:right}
  .tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .tblwrap .tbl{min-width:430px}
  .crow{display:flex;gap:10px;align-items:center;padding:10px 4px;border-bottom:1px solid #f0f2f5;cursor:pointer}
  .cava{width:38px;height:38px;border-radius:50%;font-size:18px;display:flex;align-items:center;justify-content:center;background:#eef3fa;flex-shrink:0}
  .cava.sm{width:28px;height:28px;font-size:12px;background:#8fb6dd;color:#fff;align-self:flex-end}
  .cell1{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cdate{text-align:center;margin:14px 0 4px}
  .cdate span{background:#e8ecf2;border-radius:10px;padding:2px 10px;font-size:11px;color:#67707e}
  .cbwrap{display:flex;gap:6px;margin:8px 0}
  .cbwrap.mine{flex-direction:row-reverse}
  .cb{background:#fff;border:1px solid #e3e7ee;border-radius:14px 14px 14px 4px;padding:8px 11px;font-size:14px;text-align:left;word-break:break-word;max-width:100%}
  .cbwrap.mine .cb{background:#d9edff;border-color:#c9e2f6;border-radius:14px 14px 4px 14px}
  .cact{margin:3px 0 0;display:none}
  .cquote{border-left:3px solid #9db8d4;background:#eef2f7;color:#5a6675;font-size:11px;padding:3px 8px;border-radius:6px;margin-bottom:4px;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
  .cact button{border:1px solid #d5dbe3;background:#fff;border-radius:8px;font-size:11px;padding:3px 8px;margin:0 4px 0 0;cursor:pointer}
  .info{background:#eaf3fd;color:#1a5c9e;border-radius:8px;padding:10px;font-size:13px;margin-bottom:10px}
  .muted{color:#8a93a2;font-size:12px}
  .row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:11px 4px;border-bottom:1px solid #f0f2f5;cursor:pointer;font-size:14px}
  .row>span:first-child{min-width:0;word-break:break-word}
  .badge{background:var(--red);color:#fff;border-radius:10px;font-size:11px;padding:2px 8px}
  .badge.g{background:var(--green)}
  .badge.b{background:var(--blue)}
  nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;max-width:480px;margin:0 auto;padding-bottom:env(safe-area-inset-bottom)}
  nav button{flex:1;border:none;background:none;padding:10px 0 14px;font-size:11px;color:#8a93a2;cursor:pointer}
  nav button.on{color:var(--blue);font-weight:600}
  nav button i{display:block;font-size:20px;font-style:normal}
  .req{color:var(--red);font-size:12px}
  h2{font-size:17px;margin:4px 0 12px}
  .back{color:var(--blue);font-size:13px;cursor:pointer;margin-bottom:8px;display:inline-block}
  .cmt{background:#f6f8fa;border-radius:8px;padding:8px 10px;margin-top:6px;font-size:13px}
  .seg{display:flex;border:1px solid var(--blue);border-radius:8px;overflow:hidden;margin-bottom:12px}
  .seg div{flex:1;text-align:center;padding:8px;font-size:13px;color:var(--blue);cursor:pointer}
  .seg div.on{background:var(--blue);color:#fff}
  .loginwrap{padding:40px 24px}
  .center{text-align:center}
  .spin{padding:40px;text-align:center;color:#8a93a2}
  nav button{position:relative}
  .ndot{position:absolute;top:2px;right:12px;background:var(--red);color:#fff;font-size:10px;min-width:16px;height:16px;line-height:16px;border-radius:8px;padding:0 4px;text-align:center}
  /* v1.6 入力部品 */
  .radio-row{display:block;padding:9px 12px;border:1px solid var(--line);border-radius:8px;margin-top:6px;cursor:pointer;font-size:14px}
  .radio-row input{margin-right:8px}
  .photo-grid{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
  .photo-grid .ph{position:relative;width:84px;height:84px;border-radius:8px;overflow:hidden;border:1px solid var(--line);display:block}
  .photo-grid .ph img{width:100%;height:100%;object-fit:cover}
  .photo-grid .ph .del{position:absolute;top:2px;right:2px;background:rgba(0,0,0,.55);color:#fff;border-radius:50%;width:20px;height:20px;line-height:20px;text-align:center;font-size:12px;cursor:pointer}
  .addph{width:84px;height:84px;border:2px dashed #bbb;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#8a93a2;font-size:26px;cursor:pointer}
  /* v2.6.62 マニュアルの閲覧画面: 写真は大きく・手順は枠で囲む */
  .manual-photo{width:100%;max-width:100%;height:220px;object-fit:cover;border-radius:10px;margin-top:8px;display:block;cursor:zoom-in;border:1px solid var(--line)}
  .manual-step{border:1px solid var(--line);border-radius:10px;padding:12px;margin:12px 0;background:#fafafa}
  .manual-step .steplabel{display:inline-block;background:var(--blue);color:#fff;font-weight:600;font-size:12px;padding:3px 12px;border-radius:20px}
  #lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:999;display:none;align-items:center;justify-content:center;padding:16px;cursor:zoom-out}
  #lightbox img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px}
  /* v1.6 フォームデザイナー */
  .fhandle{cursor:grab;color:#8a93a2;font-size:18px;padding:0 6px;user-select:none}
  .fnum{display:inline-block;background:#eaf3fd;color:var(--blue);border-radius:6px;font-size:12px;padding:2px 8px;font-weight:600}
  .dragover{outline:2px solid var(--blue);outline-offset:-2px}
  /* レスポンシブ: 小さいスマホ（〜379px）はナビ文字を少し縮小 */
  @media(max-width:379px){
   nav button{font-size:10px}
   nav button i{font-size:18px}
   main{padding:14px 12px}
  }
  /* レスポンシブ: タブレット・中間幅（600〜899px）は本体を少し広く */
  @media(min-width:600px) and (max-width:899px){
   .app,nav{max-width:640px}
  }
  /* v1.6 PC 2カラムレイアウト */
  @media(min-width:900px){
   body.withnav .app{max-width:940px;margin:0 0 0 calc(max(0px, 50vw - 590px) + 240px);border-left:1px solid var(--line);border-right:1px solid var(--line);padding-bottom:24px}
   body.withnav nav{top:0;bottom:0;right:auto;left:max(0px, 50vw - 590px);width:240px;max-width:240px;flex-direction:column;justify-content:flex-start;border-top:none;border-right:1px solid var(--line);padding-top:14px}
   body.withnav nav:before{content:"🐔 鳥一代グループ";display:block;font-weight:700;font-size:15px;color:var(--blue);padding:10px 20px 18px}
   body.withnav nav button{flex:0 0 auto;display:flex;align-items:center;gap:12px;padding:14px 20px;font-size:15px;text-align:left}
   body.withnav nav button i{display:inline-block;font-size:20px}
   body.withnav nav button.on{background:#eaf3fd}
   body.withnav .ndot{position:static;margin-left:auto}
   body.withnav main{padding:24px 36px}
   body.withnav header{padding:14px 36px}
   .loginwrap{max-width:480px;margin:0 auto}
  }
  /* v2.7 embed=1（統合ポータルシェル埋め込み）: withnavの940px拡張はサイドバー同梱の仕組みのため
     embed時は使えない。iframeいっぱいに広げるための専用クラス（担当F報告のバグ修正） */
  body.embedmode .app{max-width:none;margin:0}
  /* ===== v2.7 シフト管理 v5 UI（実装指示書_担当B_シフトUIv5_2026-08-24.md B-1: ①希望確認 ②調整） =====
     A-4/A-5(2026-08-29)初版は色だけモックアップに寄せる妥協案だった。
     2026-08-29 続き: モックアップ（docs/mockups/NStyle_シフト管理_UI_v5.html）どおりの
     レイアウト（PC=2カラム・カード・色分けされたシフト表）まで作り込み直す。
     専用サイドバー・ロゴまでは引き続き見送り（共通シェルを維持）だが、コンテンツ部分は
     モックアップのCSS構造（クラス名は sf- 接頭辞で共通シェルと衝突しないようにする）をほぼ移植 */
  .badge.p{background:#6849a8}
  .sf-theme{--sfgreen:#2f8f63;--sfgreensoft:#e8f5ee;--sfred:#c93f2b;--sfredsoft:#fde9e4;--sfamber:#b77b13;--sfambersoft:#fff3d8;--sfpurple:#6849a8;--sfpurplesoft:#f1ebff}
  .sf-badge{display:inline-block;padding:3px 8px;border-radius:999px;font-size:10px;font-weight:800;margin-top:4px}
  .sf-badge.green{background:var(--sfgreensoft);color:var(--sfgreen)}
  .sf-badge.red{background:var(--sfredsoft);color:var(--sfred)}
  .sf-badge.amber{background:var(--sfambersoft);color:var(--sfamber)}
  .sf-badge.blue{background:#e8f0fb;color:#2f6fb7}
  .sf-badge.purple{background:var(--sfpurplesoft);color:var(--sfpurple)}
  .sf-badge.gray{background:#f2efeb;color:#736b63}
  .sf-stepnav{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:12px 0}
  .sf-stepbtn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px;text-align:left;cursor:pointer}
  .sf-stepbtn b{display:block;font-size:12px}
  .sf-stepbtn small{display:block;color:#8a93a2;font-size:10px;margin-top:2px}
  .sf-stepbtn.active{background:#211d18;color:#fff;border-color:#211d18}
  .sf-stepbtn.active small{color:#cfc9c2}
  .sf-layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:14px}
  .sf-halfgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
  .sf-day{border:1px solid var(--line);border-radius:12px;padding:9px;cursor:pointer;background:#fff;min-height:100px}
  .sf-day b{font-size:12px}
  .sf-day.active{box-shadow:0 0 0 2px var(--blue) inset}
  .sf-day.short{background:#fff6ec}
  .sf-day .weekday{font-size:9px;color:#8a93a2}
  .sf-coverage{margin-top:7px}
  .sf-coverage strong{display:block;font-size:15px}
  .sf-tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
  .sf-tag{display:inline-block;font-size:9px;padding:3px 6px;border-radius:6px;background:#eef1f5;color:#67707e;margin-top:4px}
  .sf-tag.short{background:#fde3d3;color:#b0530e}
  .sf-tag.ok{background:#e3f4ec;color:var(--green)}
  .sf-tag.help{background:var(--sfpurplesoft);color:var(--sfpurple)}
  .sf-sidepanel{position:sticky;top:10px;height:max-content}
  .sf-mini-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
  .sf-mini{border:1px solid var(--line);border-radius:8px;padding:8px;background:#f8fafc}
  .sf-mini small{display:block;color:#8a93a2;font-size:10px}
  .sf-mini b{font-size:15px}
  .sf-person{padding:8px 0;border-bottom:1px solid #f0f2f5}
  .sf-person:last-child{border:0}
  .sf-person .row{display:flex;justify-content:space-between;gap:8px;padding:0;border:0;cursor:default}
  .sf-person .shift{font-size:11px;margin-top:3px}
  .sf-section-head{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
  .sf-section-head .body-inner{padding:14px}
  .sf-gantt-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:10px;margin:14px}
  .sf-gantt{min-width:720px;padding:8px}
  .sf-ghead,.sf-grow{display:grid;gap:2px;align-items:center}
  .sf-ghead div{font-size:9px;color:#8a93a2;text-align:center}
  .sf-ghead div:first-child{text-align:left}
  .sf-grow{min-height:34px;border-top:1px solid #f0f2f5}
  .sf-gname{font-size:11px;padding:6px 4px}
  .sf-gname b{display:block;font-size:12px}
  .sf-gname small{font-size:9px;color:#8a93a2}
  .sf-gslot{height:26px;border-radius:5px;background:#f4f6f9}
  .sf-gslot.emp{background:#e3f4ec;border:1px solid #bfe4d1}
  .sf-gslot.pa{background:#fff3d8;border:1px solid #efd9a4}
  .sf-gslot.help{background:#f1ebff;border:1px solid #d9cbf4}
  .sf-role-summary{border-top:2px solid var(--line);margin:0 14px 14px}
  .sf-role-row{display:flex;justify-content:space-between;padding:6px 2px;border-bottom:1px solid #f0f2f5;font-size:12px}
  .sf-finance{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:10px}
  .sf-finance .card{padding:13px;margin-bottom:0}
  .sf-finance small{display:block;color:#8a93a2;font-size:11px}
  .sf-finance b{font-size:20px;display:block;margin-top:4px}
  .sf-adjust-grid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:14px}
  .sf-shift-table-wrap{overflow:auto;padding:14px}
  .sf-shift-table{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%;font-size:11px}
  .sf-shift-table td{padding:5px;white-space:nowrap;text-align:center}
  .sf-shift-table td:first-child{text-align:left;min-width:150px}
  .sf-cell{border-radius:8px;padding:6px 8px;background:#f7f3ee;min-width:64px;display:inline-block;cursor:pointer}
  .sf-cell.ok{background:var(--sfgreensoft);color:var(--sfgreen)}
  .sf-cell.off{background:#f7f3ee;color:#9a9186}
  .sf-cell.need{background:var(--sfredsoft);color:var(--sfred);font-weight:800}
  .sf-cell.draft{background:#e8f0fb;color:#2f6fb7}
  .sf-reqbox{padding:14px}
  .sf-reqbox .sf-reqday{padding:8px 0;border-bottom:1px solid #f0f2f5}
  .sf-reqbox .sf-reqday:last-child{border:0}
  .sf-reqbox .sf-reqday p{margin:3px 0 0;font-size:11px;color:#8a93a2}
  .sf-note{padding:8px 10px;border-radius:8px;background:#fff8ec;border:1px solid #f0dfb8;font-size:11px;color:#7a5a10;margin-bottom:10px}
  .sf-bottom-action{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:#fff}
  .sf-pos{color:var(--green);font-weight:700}
  .sf-neg{color:var(--red);font-weight:700}
  .sf-confirmed-layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:14px}
  .sf-month-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;padding:14px}
  .sf-month-day{min-height:110px;border:1px solid var(--line);border-radius:10px;padding:8px;background:#fff}
  .sf-month-day .d{font-size:11px;color:#8a93a2;margin-bottom:4px}
  .sf-cday-pill{display:block;font-size:10px;margin-top:5px;padding:5px;border-radius:7px;background:#eafaf0;color:var(--sfgreen)}
  .sf-cday-pill.help{background:var(--sfpurplesoft);color:var(--sfpurple)}
  .sf-todo{padding:10px 0;border-bottom:1px solid #f0f2f5}
  .sf-todo:last-child{border:0}
  .sf-todo b{font-size:12px}
  .sf-todo p{margin:4px 0 0;font-size:11px;color:#8a93a2}
  .sf-actual-top{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
  .sf-actual-top .card{padding:13px}
  .sf-actual-top small{display:block;color:#8a93a2;font-size:11px}
  .sf-actual-top b{display:block;font-size:20px;margin-top:4px}
  .sf-subtabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .sf-subtab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;cursor:pointer;font-size:12px}
  .sf-subtab.active{background:#211d18;color:#fff;border-color:#211d18}
  .sf-subpanel{display:none}
  .sf-subpanel.active{display:block}
  .sf-two-col{display:grid;grid-template-columns:320px minmax(0,1fr);gap:14px}
  .sf-list-card{padding:14px}
  .sf-rank-item{padding:11px 0;border-bottom:1px solid #f0f2f5}
  .sf-rank-item:last-child{border:0}
  .sf-rank-head{display:flex;justify-content:space-between;gap:8px}
  .sf-rank-head b{font-size:13px}
  .sf-rank-head span{font-size:11px;color:#8a93a2}
  .sf-progress{height:9px;background:#f1ece5;border-radius:999px;overflow:hidden;margin-top:8px}
  .sf-progress>div{height:100%;background:linear-gradient(90deg,var(--sfgreen),#60b084)}
  .sf-rank-meta{display:flex;justify-content:space-between;gap:8px;font-size:11px;color:#5f574f;margin-top:6px}
  .sf-table-card{padding:14px}
  .sf-boost{border:2px solid #f59e0b;background:#fffbeb}
  @media(min-width:900px){
   .sf-finance{grid-template-columns:repeat(5,1fr)}
   .sf-stepnav{grid-template-columns:repeat(3,1fr)}
  }
  @media(max-width:1099px){
   .sf-layout,.sf-adjust-grid,.sf-confirmed-layout,.sf-two-col{grid-template-columns:1fr}
   .sf-sidepanel{position:static}
   .sf-actual-top{grid-template-columns:repeat(2,1fr)}
  }
  @media(max-width:759px){
   .sf-halfgrid{display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px}
   .sf-day{flex:0 0 84px;min-height:auto}
   .sf-month-grid{grid-template-columns:1fr}
   .sf-month-day{min-height:auto;display:grid;grid-template-columns:64px 1fr;gap:6px;align-items:start}
   .sf-bottom-action{flex-direction:column;align-items:stretch}
  }
</style>
</head>
<body>
<div class="app" id="app"><div class="spin">読み込み中...</div></div>
<nav id="nav" style="display:none">
  <button data-p="home"><i>🏠</i>ホーム<span class="ndot" id="homedot" style="display:none"></span></button>
  <button data-p="write"><i>✏️</i>日報</button>
  <button data-p="list"><i>📋</i>一覧<span class="ndot" id="listdot" style="display:none"></span></button>
  <button data-p="check"><i>☑️</i>チェック</button>

const REPORT_PHOTOS_PUBLIC_PREFIX="/storage/v1/object/public/report-photos/";
const _signedUrlCache=new Map(); // path -> {url, exp}
function _photoPathFrom(urlOrPath){
 const i=String(urlOrPath||"").indexOf(REPORT_PHOTOS_PUBLIC_PREFIX);
 return i>=0 ? decodeURIComponent(urlOrPath.slice(i+REPORT_PHOTOS_PUBLIC_PREFIX.length)) : urlOrPath;
}
async function resolvePhotoTags(root){
 const els=[...(root||document).querySelectorAll("[data-photo-src]:not([data-photo-resolved])")];
 if(!els.length) return;
 els.forEach(el=>el.dataset.photoResolved="pending");
 const now=Date.now();
 const need=new Set();
 els.forEach(el=>{
  const path=_photoPathFrom(el.dataset.photoSrc);
  const c=_signedUrlCache.get(path);
  if(!(c&&c.exp>now)) need.add(path);
 });
 if(need.size){
  const {data}=await sb.storage.from("report-photos").createSignedUrls([...need],3600);
  (data||[]).forEach(x=>{ if(x.signedUrl&&!x.error) _signedUrlCache.set(x.path,{url:x.signedUrl,exp:now+55*60*1000}); });
 }
 els.forEach(el=>{
  const path=_photoPathFrom(el.dataset.photoSrc);
  const c=_signedUrlCache.get(path);
  el.dataset.photoResolved=c?"1":"";
  if(!c) return;
  if(el.tagName==="IMG") el.src=c.url; else el.href=c.url;
 });
}

function friendlyErr(s){
 const t=String(s||"");
 if(/row-level security|permission denied|insufficient privilege/i.test(t))return "権限がないため保存できませんでした。本部にお問い合わせください";
 if(/duplicate key|already exists|unique constraint/i.test(t))return "同じ内容がすでに登録されています";
 if(/Failed to fetch|NetworkError|network|timeout/i.test(t))return "通信エラーです。電波の良い場所でもう一度お試しください";
 if(/JWT|token is expired|invalid claim/i.test(t))return "ログインの有効期限が切れました。一度ログインし直してください";
 if(/violates foreign key/i.test(t))return "関連するデータが見つかりませんでした。画面を再読み込みしてお試しください";
 if(/value too long/i.test(t))return "入力が長すぎます。文字数を減らしてお試しください";
 return t;
}

// v2.6.45 電話番号にハイフンを自動で入れる（桁の間違いに気づきやすくする）
function fmtPhone(v){
 const d=String(v||"").replace(/[^0-9]/g,"").slice(0,11);
 if(!d)return "";
 const cut=(a,b)=>d.length<=a?d:(d.length<=b?d.slice(0,a)+"-"+d.slice(a):d.slice(0,a)+"-"+d.slice(a,b)+"-"+d.slice(b));
 if(/^0120/.test(d))return cut(4,7);        // フリーダイヤル
 if(/^(0[789]0|050)/.test(d))return cut(3,7); // 携帯・IP電話
 if(/^0[36]/.test(d))return cut(2,6);        // 東京・大阪
 return cut(3,6);                            // その他の固定電話
}
// 桁数の確認（10桁か11桁が正しい）
const phoneDigits=v=>String(v||"").replace(/[^0-9]/g,"").length;
const phoneOk=v=>{const n=phoneDigits(v);return n===10||n===11};
// 入力欄に「打ちながらハイフンが入る」動きを付ける
function bindPhone(id){
 const el=$(id);if(!el)return;
 el.addEventListener("input",()=>{
  const before=el.value,after=fmtPhone(before);
  if(before!==after)el.value=after;
  const n=phoneDigits(after);
  el.style.borderColor=(n===0||phoneOk(after))?"":"var(--red)";
 });
}
// v2.6.45 住所から郵便番号を調べる（郵便番号→住所の逆）
async function zipFromAddress(addr){
 const key=String(addr||"").replace(/[0-9０-９\-ー－]+.*$/,"").trim(); // 番地から後ろは外す
 if(key.length<3)return null;
 try{
  const res=await fetch("https://geoapi.heartrails.com/api/json?method=suggest&matching=like&keyword="+encodeURIComponent(key));
  const j=await res.json();
  const l=j&&j.response&&j.response.location;
  if(!l||!l.length)return null;
  return l[0]; // {postal, prefecture, city, town, x, y}
 }catch(e){return null}
}
// v2.6.45 住所から最寄り駅の候補を調べる
async function stationsNear(addr){
 const loc=await zipFromAddress(addr);
 if(!loc||!loc.x||!loc.y)return [];
 try{
  const res=await fetch(`https://express.heartrails.com/api/json?method=getStations&x=${loc.x}&y=${loc.y}`);
  const j=await res.json();
  const st=(j&&j.response&&j.response.station)||[];
  const seen={},out=[];
  st.forEach(s=>{const k=s.name+"|"+s.line;if(seen[k])return;seen[k]=1;out.push(s)});
  return out.slice(0,6);
 }catch(e){return []}
}
function bindZip(zipId,addrId){
 const z=$(zipId),a=$(addrId);
 if(!z||!a)return;
 let last="";
 const look=async()=>{
  const code=z.value.replace(/[^0-9]/g,"");
  if(code.length!==7||code===last)return;
  last=code;
  try{
   const res=await fetch("https://zipcloud.ibsnet.co.jp/api/search?zipcode="+code);
   const j=await res.json();
   const r=j&&j.results&&j.results[0];
   if(!r){toast("この郵便番号の住所が見つかりませんでした",true);return}
   const base=(r.address1||"")+(r.address2||"")+(r.address3||"");
   if(!a.value.trim()){a.value=base;toast("住所を自動で入れました。続けて番地・建物名をご入力ください")}
   else if(!a.value.startsWith(base))toast("住所がすでに入力されています（自動入力していません）");
  }catch(e){ /* つながらないときは何もしない（手入力できるため） */ }
 };
 z.oninput=look; z.onblur=look;
 // v2.6.45 住所を先に入れたときは、郵便番号を自動で埋める（逆引き）
 a.addEventListener("blur",async()=>{
  if(z.value.replace(/[^0-9]/g,"").length===7)return; // すでに入っていれば触らない
  if(!a.value.trim())return;
  const loc=await zipFromAddress(a.value);
  if(!loc||!loc.postal)return;
  z.value=loc.postal.slice(0,3)+"-"+loc.postal.slice(3);
  last=loc.postal;
  toast("住所から郵便番号を入れました");
 });

// v2.6.23 ドラッグで並び替えする共通処理
// handleSel=つまみ / cardSel=行全体 / key=data-属性名 / getList=並べ替える配列 / collect=画面の入力内容を配列に取り込む関数
function bindDrag(handleSel,cardSel,key,getList,collect){
 let di=null;
 document.querySelectorAll(handleSel).forEach(hd=>{
  hd.ondragstart=e=>{di=+hd.dataset[key];e.dataTransfer.effectAllowed="move"};
 });
 document.querySelectorAll(cardSel).forEach(cd=>{
  cd.ondragover=e=>{e.preventDefault();cd.classList.add("dragover")};
  cd.ondragleave=()=>cd.classList.remove("dragover");
  cd.ondrop=e=>{
   e.preventDefault();cd.classList.remove("dragover");
   const to=+cd.dataset[key];
   if(di==null||isNaN(to)||di===to)return;
   collect();const l=getList();const [m]=l.splice(di,1);l.splice(to,0,m);di=null;render();
  };
 });
}

// v2.6.32 応募時の回答から、入社フォームの項目に合うものを探す
// 探し方の順番を決められるようにしてある（例: 「現住所」を「住所」より先に見る）
function joinPick(ans,pats,exclude){
 if(!ans||typeof ans!=="object")return "";
 const keys=Object.keys(ans);
 for(const p of pats){
  for(const k of keys){
   if(!k.includes(p))continue;
   if(exclude&&exclude.some(x=>k.includes(x)))continue;
   const v=ans[k];
   if(v==null||v===""||(Array.isArray(v)&&!v.length))continue;
   return Array.isArray(v)?v.join("、"):String(v);
  }
 }
 return "";
}
// v2.6.34 Googleスプレッドシートの日付がそのまま英語の文字列で入っていることがある
// 例:「Mon Feb 24 2003 00:00:00 GMT+0900 (Japan Standard Time)」
const RAW_DATE=/^[A-Z][a-z]{2} [A-Z][a-z]{2} \d{1,2} \d{4} \d{2}:\d{2}:\d{2}/;
const pad2=n=>String(n).padStart(2,"0");
// 画面に出すときに読みやすい形に直す（元のデータはそのまま。表示だけ整える）
function fmtAnswerVal(v){
 const s=String(v==null?"":v);
 if(!RAW_DATE.test(s))return s;
 const d=new Date(s);
 if(isNaN(d.getTime()))return s;
 const ymd=`${d.getFullYear()}/${pad2(d.getMonth()+1)}/${pad2(d.getDate())}`;
 return (d.getHours()||d.getMinutes())?`${ymd} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`:ymd;
}
// 「1990/1/2」「1990年1月2日」などをカレンダー入力の形（1990-01-02）に直す
function toDateVal(s){
 const t=String(s||"");
 if(RAW_DATE.test(t)){ // 英語の日付はそのまま数字を拾うと 2003-00-00 になってしまうので先に処理する
  const d=new Date(t);
  if(!isNaN(d.getTime()))return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
 }
 const m=t.match(/(\d{4})\D{1,3}(\d{1,2})\D{1,3}(\d{1,2})/);
 return m?`${m[1]}-${pad2(m[2])}-${pad2(m[3])}`:"";
}

async function recruitUnreadCount(){
 try{
  if(!can("recruit"))return 0;
  const since=new Date(Date.now()-90*864e5).toISOString();
  const {data:as}=await sb.from("applicants")
   .select("id,form_received_at,msg_received_at,line_linked_at")
   .or(`form_received_at.gte.${since},msg_received_at.gte.${since},line_linked_at.gte.${since}`)
   .limit(500);
  if(!as||!as.length)return 0;
  const {data:rr}=await sb.from("applicant_reads").select("applicant_id,read_at")
   .eq("user_id",me.id).in("applicant_id",as.map(a=>a.id));
  const read={};(rr||[]).forEach(x=>read[x.applicant_id]=new Date(x.read_at).getTime());
  const isNew=(t,r)=>!!(t&&new Date(t).getTime()>r);
  return as.filter(a=>{const r=read[a.id]||0;
   return isNew(a.form_received_at,r)||isNew(a.msg_received_at,r)||isNew(a.line_linked_at,r)}).length;
 }catch(e){return 0}
}

const LIST_UNREAD_DAYS=7;
async function listUnreadCount(){
 try{
  const since=new Date(Date.now()-LIST_UNREAD_DAYS*864e5).toISOString().slice(0,10);
  const {data:rs}=await sb.from("reports").select("id,updated_at").gte("report_date",since).neq("author_id",me.id).limit(500);
  if(!rs||!rs.length)return 0;
  const {data:reads}=await sb.from("report_reads").select("report_id,created_at").eq("user_id",me.id).in("report_id",rs.map(r=>r.id));
  const readAt={};(reads||[]).forEach(x=>readAt[x.report_id]=x.created_at);
  return rs.filter(r=>isUnread(r,readAt[r.id])).length;
 }catch(e){return 0}
}
// 未読の判定: まだ読んでいない or 読んだ後に修正された（時刻は日時に直して比べる）
function isUnread(r,read){
 if(!read)return true;
 if(!r.updated_at)return false;
 return new Date(r.updated_at).getTime()>new Date(read).getTime();
}

// ===== v2.6.22 画面の履歴（ブラウザの←ボタン・スマホの右スワイプに対応） =====
// 画面の状態をブラウザの履歴に積んでおき、戻る操作で元の状態に復元する。
// ※ ここの変数は let 宣言のため window に生えない。明示的に読み書きする
function navSnapshot(){
 return {page,detail,editId,adminMode,adminDetail,setMode,rcDetail,rcJobs,chatRoom,chatNew,ckAdminMode};
}
function navApply(st){
 page=st.page;detail=st.detail;editId=st.editId;adminMode=st.adminMode;adminDetail=st.adminDetail;
 setMode=st.setMode;rcDetail=st.rcDetail;rcJobs=st.rcJobs;chatRoom=st.chatRoom;chatNew=st.chatNew;
 ckAdminMode=st.ckAdminMode;
}
let navLast=null,navStack=[],navSkipPop=false;
function navSync(){
 const cur=navSnapshot(),j=JSON.stringify(cur);
 if(navLast===null){history.replaceState({nav:cur},"");navLast=j;navStack=[j];return}
 if(j===navLast)return;
 // アプリ内の「← 戻る」で1つ前の画面に戻ったときは、履歴も1つ戻す
 // （そうしないと履歴が増え続け、ブラウザの戻るで画面が進んでしまう）
 if(navStack.length>=2&&navStack[navStack.length-2]===j){
  navStack.pop();navLast=j;navSkipPop=true;history.back();return;
 }
 navStack.push(j);history.pushState({nav:cur},"");navLast=j;
}
window.addEventListener("popstate",e=>{
 if(navSkipPop){navSkipPop=false;return} // 上のhistory.back()による分は無視
 if(!e.state||!e.state.nav||!me)return;  // ログイン前などは何もしない
 navApply(e.state.nav);
 navLast=JSON.stringify(navSnapshot());
 if(navStack.length>1)navStack.pop();
 rcMsgs=null;
 render();
});

// v2.6.57 所属店舗の売上・FL（目標／実績）。社員以上にだけ表示（アルバイト・外販には出さない）。
// データがまだ無ければ何も出さない（連携前のうちは今までどおりの画面のまま）
// v2.6.68 店舗別に出せるよう、集計まわりを共通の部品に分けた（日報一覧・詳細／週報からも同じ部品を使う）
const dashSum=(arr,k)=>(arr||[]).reduce((s,x)=>s+(Number(x[k])||0),0);
const dashFlPct=(cost,labor,sales)=>sales>0?Math.round((cost+labor)/sales*1000)/10:null;
const dashFlTargetPct=tm=>(tm&&tm.length)?Math.round((dashSum(tm,"pa_rate")+dashSum(tm,"emp_rate")+dashSum(tm,"cost_rate"))/tm.length*10)/10:null;
const dashYen=n=>"¥"+Math.round(n).toLocaleString("ja-JP");
function dashRowLine(label,salesAct,salesTgt,flAct,flTgt){
 const rate=salesTgt>0?Math.round(salesAct/salesTgt*100):null;
 return `<p style="margin:8px 0 0;font-size:13px"><b>${label}</b><br>
  売上: ${dashYen(salesAct)}${salesTgt?`／目標 ${dashYen(salesTgt)}（達成率 ${rate}%）`:""}<br>
  FL: ${flAct!=null?flAct+"%":"—"}${flTgt!=null?`／目標 ${flTgt}%`:""}</p>`;
}
// 指定した店舗ID一覧・期間の実績／目標／FL目標をまとめて取ってくる（エラー・未連携時は空で返す）
async function fetchDashRange(storeIds,fromStr,toStr,ymList){
 if(!storeIds||!storeIds.length)return {act:[],tgt:[],tm:[]};
 try{
  const [r1,r2,r3]=await Promise.all([
   sb.from("dash_sales_daily").select("store_id,biz_date,sales,cost,labor").in("store_id",storeIds).gte("biz_date",fromStr).lte("biz_date",toStr),
   sb.from("dash_sales_target_daily").select("store_id,biz_date,sales_target").in("store_id",storeIds).gte("biz_date",fromStr).lte("biz_date",toStr),
   sb.from("dash_target_monthly").select("store_id,ym,pa_rate,emp_rate,cost_rate").in("store_id",storeIds).in("ym",ymList)
  ]);
  return {act:r1.data||[],tgt:r2.data||[],tm:r3.data||[]};
 }catch(e){return {act:[],tgt:[],tm:[]}}
}

// v2.6.68 日報の一覧から開いた「詳細」画面でも、その日報の店舗・日付を基準に前日・当月累計を見せる
// v2.6.73 チーム長の日報・週報は、その日報が付いている店舗1つだけでなく、
//   担当店舗（team_stores）全部の売上・FLを見せる（現場に出た店舗だけに限定されないように）
// B-6 未提出判定の母数を「公開済みシフト（sf_shifts status=published）でその日出勤予定の人」に変更。
//   ある人の所属店舗のどれかで、その日のシフトが公開済みなら「出勤予定の人だけ」を対象にする。
//   1件も公開されていない店舗・期間は今までどおり「所属している人は全員対象」にフォールバックする
async function expectedTodaySet(userIds){
 const today=todayStr(),expected={};
 userIds.forEach(id=>expected[id]=true); // 既定=全員対象（フォールバック）
 if(!userIds.length)return expected;
 try{
  const [{data:us},{data:shifts}]=await Promise.all([
   sb.from("user_stores").select("user_id,store_id").in("user_id",userIds),
   sb.from("sf_shifts").select("user_id,store_id,is_off").eq("work_date",today).eq("status","published")
  ]);
  const storesPublished=new Set((shifts||[]).map(s=>s.store_id));
  const working=new Set((shifts||[]).filter(s=>!s.is_off).map(s=>s.user_id));
  const storesByUser={};(us||[]).forEach(row=>{(storesByUser[row.user_id]=storesByUser[row.user_id]||[]).push(row.store_id)});
  userIds.forEach(id=>{
   const uStores=storesByUser[id]||[];
   const governed=uStores.some(sid=>storesPublished.has(sid)); // この人の店舗のどれかでシフトが公開済み
   if(governed)expected[id]=working.has(id); // 公開済みなら「出勤予定か」で判定
   // 公開されていない店舗の人は expected=true のまま（フォールバック）
  });
 }catch(e){} // 取得に失敗しても、これまでどおり全員を対象にして表示は壊さない
 return expected;
}

// v2.6.69 週報の対象期間は「火〜月」。含まれる日付から、直近の月曜（dateStr自身が月曜ならその日）を
//   期間の最終日として計算する（例: 火曜に開く→前日の月曜で終わった先週火〜月／月曜に開けば
//   その日が最終日の今週火〜月＝提出期限は明日の火曜16:00でまだ間に合う期間）
// B-9 バグ修正（2026-08-27）: 以前は「月曜はまだ終わっていない」という理由でdow===1のときだけ
//   さらに1週間分（back=7）戻していたため、月曜に週報を書くと「今週」ではなく2週間前の期間が
//   表示され、先週の週報で入力した「次週目標」（PA時間数等）の引き継ぎ先の期間もズレて
//   見つからなくなっていた（fetchCarriedBudgetsの検索窓が丸ごと1週間ズレる）。back=0（＝今日が
//   その週の最終日）はそのまま今日を最終日として扱うのが正しい
function weekRangeFor(dateStr){
 const d=new Date(dateStr+"T00:00:00Z");
 const dow=d.getUTCDay(); // 0=日 1=月 2=火 … 6=土
 const back=(dow-1+7)%7; // 直近の月曜（今日を含む）まで何日前か
 const end=new Date(d);end.setUTCDate(d.getUTCDate()-back); // 対象期間の最終日（月曜）
 const start=new Date(end);start.setUTCDate(end.getUTCDate()-6); // その週の火曜（開始日）
 const f=x=>x.toISOString().slice(0,10);
 return {weekStart:f(start),weekEnd:f(end)};
}
// v2.6.69 週報の提出期限＝対象期間の翌火曜16:00（JST）をUTCのISO文字列で返す
function weekDeadlineIso(weekEnd){
 const d=new Date(weekEnd+"T00:00:00Z");
 d.setUTCDate(d.getUTCDate()+1); // 月曜の翌日＝火曜
 d.setUTCHours(7,0,0,0); // JST16:00 = UTC7:00
 return d.toISOString();
}
// 期間が月をまたぐ場合、両方の月のFL目標を拾えるようにする
function ymListFor(fromStr,toStr){
 const a=fromStr.slice(0,7)+"-01",b=toStr.slice(0,7)+"-01";
 return a===b?[a]:[a,b];
}
// v2.6.69 ダイニー点数・口コミ件数の目標（列が無い環境でも落ちないようtry/catch）

 try{

// v2.6.71 手入力できる項目（PA時間数・Google口コミ数・ダイニー点数）の答えを保存するキー名
//   店舗ごとに別の値なので、店舗IDを付けて区別する（チーム長は複数店舗ぶん同時に持てる）
const scoreKey=(base,storeId)=>`${base}__${storeId}`;
// v2.6.76 予算欄のロックを一時的に外した項目（キー単位）。編集画面を開き直すとまた閉じる
let unlockedScoreKeys={};
let weeklyHasUnderachievement=false; // B-11(2026-08-27) weeklyDashPanelHtml()が書く画面を作るたびに更新。submitReport()の必須チェックで参照
// v2.6.76 先週の「次週目標」を、今週の予算として引き継ぐ。既定では変更できない
//   （社長・本部・チーム長・店長だけ変更できる。それ以外はいつも表示のみ）
async function fetchCarriedBudgets(storeIds,weekStart,authorId){
 const prevStart=new Date(weekStart+"T00:00:00Z");prevStart.setUTCDate(prevStart.getUTCDate()-7);
 const prevEnd=new Date(weekStart+"T00:00:00Z");prevEnd.setUTCDate(prevEnd.getUTCDate()-1);
 const f=x=>x.toISOString().slice(0,10);
 const map={};
 try{
  const {data}=await sb.from("reports").select("answers,report_date")
   .eq("kind","weekly").eq("author_id",authorId).gte("report_date",f(prevStart)).lte("report_date",f(prevEnd))
   .order("report_date",{ascending:false}).limit(3);
  (data||[]).forEach(r=>{
   const a=r.answers||{};
   storeIds.forEach(sid=>{
    if(map[sid])return; // 新しい提出を優先（降順で取得済み）
    const k=b=>scoreKey(b,sid);
    if(a[k("nextPaTarget")]!=null||a[k("nextReviewTarget")]!=null||a[k("nextDiniiTarget")]!=null){
     map[sid]={pa:a[k("nextPaTarget")]??null,review:a[k("nextReviewTarget")]??null,dinii:a[k("nextDiniiTarget")]??null};
    }
   });
  });
 }catch(e){}
 return map;
}
// v2.6.69 週報のスコアカード（項目／予算／実績／差異／予算比率）を1店舗ぶん作る
// editable=true のときは、手入力の項目（PA時間数・Google口コミ数・ダイニー点数）を入力欄で出す
// B-11(2026-08-27) 戻り値を{html,hasUnder}に変更（未達行が1つでもあればhasUnder=true）。
//   呼び出し側は .html を使えばよいが、書く画面（weeklyDashPanelHtml）だけは
//   .hasUnder を集計して「未達の理由・改善策」欄の要否を判定する
function weeklyScorecardHtml(storeName,vals,editable){
 const yen=n=>"¥"+Math.round(n).toLocaleString("ja-JP");
 const num1=n=>(Math.round(n*10)/10).toLocaleString("ja-JP");
 const pct1=n=>(Math.round(n*10)/10)+"%";
 let hasUnder=false;
 const underStyle=rate=>(rate!=null&&rate<100)?' style="background:#fef2f2"':"";
 // B-5.2 バグ修正: 「予算比率」は今まで一律「実績÷予算×100」だった。原価率のように
 //   「低いほど良い」項目だとこの式のままでは、実績が予算より低い（＝良い結果）のに比率が100%未満になり、
 //   感覚と逆に見えていた。reverse=trueのときは「予算÷実績×100」にして、
 //   どの項目でも「100%以上＝目標達成・良い」に揃える（実績0のときは割れないので—表示のまま）
 const autoRow=(label,budget,actual,fmt,reverse)=>{
  const hasB=budget!=null&&budget!=="",hasA=actual!=null&&actual!=="";
  const b=hasB?Number(budget):null,a=hasA?Number(actual):null;
  const diff=(hasB&&hasA)?a-b:null;
  let rate=null;
  if(hasB&&hasA&&b!==0){
   rate=reverse?(a!==0?Math.round(b/a*1000)/10:null):Math.round(a/b*1000)/10;
  }
  if(rate!=null&&rate<100)hasUnder=true;
  return `<tr${underStyle(rate)}><td style="padding:4px 6px">${esc(label)}</td>
   <td style="padding:4px 6px;text-align:right">${hasB?fmt(b):"—"}</td>
   <td style="padding:4px 6px;text-align:right">${hasA?fmt(a):"—"}</td>
   <td style="padding:4px 6px;text-align:right">${diff!=null?fmt(diff):"—"}</td>
   <td style="padding:4px 6px;text-align:right">${rate!=null?`<b style="color:${rate<100?"#c0392b":"inherit"}">${rate}%</b>`:"—"}</td></tr>`;
 };
 // v2.6.71 手入力の項目（黄色背景）。editableなら入力欄、そうでなければ入れた値をそのまま表示
 // v2.6.76 予算（bKey）は、先週の「次週目標」から引き継いだ値があれば既定でロック（opts.locked）。
 //   ロック中は数字だけ表示し、権限がある人（opts.canOverride）だけ✏️で編集を開ける。
 //   ロックを外して元と違う値にした場合は「当初の目標」を小さく残す（opts.orig）
 // B-10(2026-08-27) opts.reverse=trueのときはautoRowと同じく「予算÷実績×100」に反転（少ないほど良い項目用）
 const manualRow=(label,opts)=>{
  const{bKey,aKey,origKey,bVal,aVal,fmt,locked,orig,canOverride,changedBy,changedAt,reverse}=opts;
  const hasB=bVal!=null&&bVal!=="",hasA=aVal!=null&&aVal!=="";
  const b=hasB?Number(bVal):null,a=hasA?Number(aVal):null;
  const diff=(hasB&&hasA)?a-b:null;
  let rate=null;
  if(hasB&&hasA&&b!==0){
   rate=reverse?(a!==0?Math.round(b/a*1000)/10:null):Math.round(a/b*1000)/10;
  }
  if(rate!=null&&rate<100)hasUnder=true;
  let bCell;
  if(!editable){
   bCell=hasB?fmt(b):"—";
  }else if(locked&&!unlockedScoreKeys[bKey]){
   bCell=`<span style="font-size:12px">${hasB?fmt(b):"—"}</span>${canOverride?` <span class="muted" style="font-size:11px;color:var(--blue);cursor:pointer" data-scoreunlock="${bKey}">✏️変更</span>`:` <span class="muted" style="font-size:10px">🔒</span>`}`
    +`<input type="hidden" data-fkd="${bKey}" value="${hasB?b:""}">`; // ロック中もformに値を残す（消えないように）
  }else{
   bCell=`<input type="number" step="0.1" inputmode="decimal" class="inp scorecalc" data-fkd="${bKey}" value="${bVal==null||bVal===""?"":esc(bVal)}" style="width:76px;margin:0;text-align:right;font-size:12px;padding:4px 6px;background:#fffbe6">`;
  }
  const aCell=editable
   ?`<input type="number" step="0.1" inputmode="decimal" class="inp scorecalc" data-fkd="${aKey}" value="${aVal==null||aVal===""?"":esc(aVal)}" style="width:76px;margin:0;text-align:right;font-size:12px;padding:4px 6px;background:#fffbe6">`
   :(hasA?fmt(a):"—");
  // v2.6.76 引き継いだ元の目標を、常にformへ残しておく（提出時、変更履歴として answers に保存されるように）
  const origHidden=(editable&&orig!=null&&origKey)?`<input type="hidden" data-fkd="${origKey}" value="${orig}">`:"";
  const changedNote=(changedBy&&changedAt)?`<br>${esc(changedBy)}が${new Date(changedAt).toLocaleDateString("ja-JP")}に変更`:"";
  const origNote=(orig!=null&&hasB&&Number(orig)!==b)?`<div class="muted" style="font-size:10px">当初の目標: ${fmt(Number(orig))}${changedNote}</div>`:"";
  return `<tr${underStyle(rate)}><td style="padding:4px 6px">${esc(label)}${origHidden}</td>
   <td style="padding:4px 6px;text-align:right">${bCell}${origNote}</td>
   <td style="padding:4px 6px;text-align:right">${aCell}</td>
   <td style="padding:4px 6px;text-align:right">${diff!=null?fmt(diff):"—"}</td>
   <td style="padding:4px 6px;text-align:right">${rate!=null?`<b style="color:${rate<100?"#c0392b":"inherit"}">${rate}%</b>`:"—"}</td></tr>`;
 };
 const html=`<div class="card" style="overflow-x:auto"><h3 style="margin:0 0 8px">🐔 ${esc(storeName)}</h3>
  <table style="width:100%;border-collapse:collapse;font-size:12px;white-space:nowrap">
   <tr style="border-bottom:1px solid var(--line)"><th style="text-align:left;padding:4px 6px">項目</th><th style="text-align:right;padding:4px 6px">予算</th><th style="text-align:right;padding:4px 6px">実績</th><th style="text-align:right;padding:4px 6px">差異</th><th style="text-align:right;padding:4px 6px">予算比率</th></tr>
   ${autoRow("売上",vals.salesTgt,vals.salesAct,yen)}
   ${manualRow("PA時間数（少ないほど◎）",{bKey:vals.paBudgetKey,aKey:vals.paActualKey,origKey:vals.paOrigKey,bVal:vals.paBudget,aVal:vals.paActual,fmt:n=>num1(n)+"h",locked:vals.paLocked,orig:vals.paOrig,canOverride:vals.canOverride,changedBy:vals.paChangedBy,changedAt:vals.paChangedAt,reverse:true})}
   ${autoRow("原価率（低いほど◎）",vals.costTgt,vals.costAct,pct1,true)}
   ${manualRow("Google口コミ数",{bKey:vals.reviewBudgetKey,aKey:vals.reviewActualKey,origKey:vals.reviewOrigKey,bVal:vals.reviewBudget,aVal:vals.reviewActual,fmt:num1,locked:vals.reviewLocked,orig:vals.reviewOrig,canOverride:vals.canOverride,changedBy:vals.reviewChangedBy,changedAt:vals.reviewChangedAt})}
   ${manualRow("ダイニー点数",{bKey:vals.diniiBudgetKey,aKey:vals.diniiActualKey,origKey:vals.diniiOrigKey,bVal:vals.diniiBudget,aVal:vals.diniiActual,fmt:num1,locked:vals.diniiLocked,orig:vals.diniiOrig,canOverride:vals.canOverride,changedBy:vals.diniiChangedBy,changedAt:vals.diniiChangedAt})}
  </table>
  ${hasUnder?`<p style="margin:8px 0 0;font-size:11px;color:#c0392b">⚠️ 赤字の項目は未達です</p>`:""}
  ${editable?`<p class="muted" style="margin:8px 0 0;font-size:11px">黄色い欄（実績）は毎回手入力です。予算欄の🔒は先週の「次週目標」から引き継いだもので、勝手に変えられないよう基本ロックされています（変更すると元の目標も記録されます）</p>`:""}</div>`;
 return {html,hasUnder};
}

const WX_ICON={0:"☀️",1:"🌤️",2:"⛅",3:"☁️",45:"🌫️",48:"🌫️",51:"🌦️",53:"🌦️",55:"🌧️",56:"🌧️",57:"🌧️",61:"🌦️",63:"🌧️",65:"🌧️",66:"🌧️",67:"🌧️",71:"🌨️",73:"🌨️",75:"❄️",77:"🌨️",80:"🌦️",81:"🌧️",82:"⛈️",85:"🌨️",86:"❄️",95:"⛈️",96:"🌩️",99:"🌩️"};

let tomorrowWx=null,tomorrowWxLoading=false; // {storeId:{code,tmax,tmin,prec}}（取得後にrender()で反映）
async function ensureTomorrowWeather(){
 if(tomorrowWx||tomorrowWxLoading)return;
 const storeIds=(me.stores||[]).map(s=>s.id);
 if(!storeIds.length){tomorrowWx={};return}
 tomorrowWxLoading=true;
 const results={};
 try{
  const {data:rows}=await sb.from("stores").select("id,weather_lat,weather_lon").in("id",storeIds);
  await Promise.all((rows||[]).filter(r=>r.weather_lat!=null&&r.weather_lon!=null).map(async r=>{
   try{
    const url=`https://api.open-meteo.com/v1/forecast?latitude=${r.weather_lat}&longitude=${r.weather_lon}&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum&timezone=Asia%2FTokyo&forecast_days=2`;
    const j=await (await fetch(url)).json();
    const d=j&&j.daily;
    if(d&&d.time&&d.time.length>1){
     results[r.id]={code:Number(d.weather_code[1]),tmax:d.temperature_2m_max[1],tmin:d.temperature_2m_min[1],prec:Number(d.precipitation_sum[1])||0};

 }catch(e){}

//   すでに提出された過去の日報・週報の記録は変わらないようにする（sales_snapshotに保存）
async function buildDailySnapshot(reportDate){
 const storeIds=(me.stores||[]).map(s=>s.id);
 if(!storeIds.length)return null;
 const d=new Date(reportDate+"T00:00:00Z");d.setUTCDate(d.getUTCDate()-1);
 const yStr=d.toISOString().slice(0,10),mStart=yStr.slice(0,7)+"-01";
 const {act,tgt,tm}=await fetchDashRange(storeIds,mStart,yStr,[mStart]);
 return {kind:"daily",yStr,stores:(me.stores||[]).map(s=>{
  const sAct=act.filter(x=>x.store_id===s.id),sTgt=tgt.filter(x=>x.store_id===s.id),sTm=tm.filter(x=>x.store_id===s.id);
  const yestAct=sAct.filter(x=>x.biz_date===yStr),yestTgt=sTgt.filter(x=>x.biz_date===yStr);
  return {id:s.id,name:s.name,
   yestSales:dashSum(yestAct,"sales"),yestTarget:sTgt.length?dashSum(yestTgt,"sales_target"):null,
   yestFL:dashFlPct(dashSum(yestAct,"cost"),dashSum(yestAct,"labor"),dashSum(yestAct,"sales")),
   monthSales:dashSum(sAct,"sales"),monthTarget:sTgt.length?dashSum(sTgt,"sales_target"):null,
   monthFL:dashFlPct(dashSum(sAct,"cost"),dashSum(sAct,"labor"),dashSum(sAct,"sales")),
   flTarget:dashFlTargetPct(sTm)};
 })};
}

function reportToText(rp){
 const fmt=rp.kind==="weekly"?weeklyFmt():fmtAll(me.role);
 const store=(me.stores[0]&&me.stores[0].name)||"";
 let t=`📝 ${me.name}さん（${ROLE_NAME[me.role]||""}）の${rp.kind==="weekly"?"週報":"日報"}　${fmtDate(rp.report_date)}`;
 if(store)t+=`\n🏪 ${store}`;
 const seen={};
 fmt.forEach(f=>{
  if(seen[f.k])return;seen[f.k]=1;
  const v=(rp.answers||{})[f.k];
  if(v==null||v===""||(Array.isArray(v)&&!v.length))return;
  let s;
  if(f.type==="stars")s="★".repeat(+v||0)+"☆".repeat(Math.max(0,5-(+v||0)));
  else if(f.type==="num")s=v+"点";
  else if(f.type==="photo")s=`写真${(Array.isArray(v)?v.length:1)}枚`;
  else if(Array.isArray(v))s=v.join("、");
  else s=String(v);
  s=s.trim();if(!s)return;
  t+=`\n\n【${f.label}】\n${s.length>400?s.slice(0,400)+"…":s}`;
 });
 return t;
}

// v2.6.58 マニュアルのファイルをアップロード → 公開URLを返す（失敗時はnull・トーストで理由を出す）
async function uploadManualFile(f,labelEl){ // labelEl: クリックされた「ファイルを選ぶ」のlabel要素（あれば）。
 // v2.6.58 途中でrender()すると、入力中の名前欄などが消えてしまうため、
 // アップロード中は該当ボタンの文字だけ直接書き換える（画面全体は再描画しない）
 const orig=labelEl?labelEl.firstChild.textContent:null;
 if(labelEl)labelEl.firstChild.textContent="アップロード中…";
 const ext=((f.name.split(".").pop()||"dat").toLowerCase().replace(/[^a-z0-9]/g,""))||"dat";
 const path=me.id+"/"+Date.now()+"_"+Math.random().toString(36).slice(2,8)+"."+ext;
 const {error}=await sb.storage.from("manual-files").upload(path,f,{contentType:f.type||"application/octet-stream"});
 if(labelEl&&orig!=null)labelEl.firstChild.textContent=orig;
 if(error){toast("アップロードエラー: "+error.message+"（SQLの v2_6_58 が未実行、または対応していないファイル形式の可能性があります）",true);return null}
 const {data}=sb.storage.from("manual-files").getPublicUrl(path);
 toast("アップロードしました");
 return data.publicUrl;
}

// B-4 リッチテキスト装飾（見出し・本文ブロックのみ。既存データにb.bold/size/colorが無ければ今までどおりの見た目）
const MANUAL_SIZES={s:"13px",m:"15px",l:"19px",xl:"24px"};
const MANUAL_HEX_RE=/^#[0-9a-fA-F]{3,8}$/;
function manualBlockStyle(b){
 let s="";
 if(b.bold)s+="font-weight:700;";
 if(b.size&&MANUAL_SIZES[b.size])s+=`font-size:${MANUAL_SIZES[b.size]};`;
 if(b.color&&MANUAL_HEX_RE.test(b.color))s+=`color:${b.color};`;
 return s;
}
// 見出し・本文ブロックの装飾ツールバー（太字・文字サイズ・文字色）
function manualDecoBarHtml(b,i){
 if(b.type!=="heading"&&b.type!=="text")return "";
 return `<div style="display:flex;gap:6px;align-items:center;margin-bottom:6px;flex-wrap:wrap">
  <span class="chip ${b.bold?"on":""}" data-bbold="${i}" style="font-weight:700;font-size:12px;padding:3px 10px">B</span>
  <select data-bsize="${i}" style="width:auto;margin:0;font-size:12px;padding:4px 6px">
   <option value="s" ${b.size==="s"?"selected":""}>小</option>
   <option value="m" ${(!b.size||b.size==="m")?"selected":""}>標準</option>
   <option value="l" ${b.size==="l"?"selected":""}>大</option>
   <option value="xl" ${b.size==="xl"?"selected":""}>特大</option>
  </select>
  <input type="color" data-bcolor="${i}" value="${MANUAL_HEX_RE.test(b.color)?b.color:"#1a1a1a"}" title="文字色" style="width:32px;height:28px;padding:0;border:1px solid var(--line);border-radius:6px;margin:0">
  ${b.color?`<span class="chip" data-bcolorclear="${i}" style="font-size:11px">既定色に戻す</span>`:""}
 </div>`;
}

// v2.6.61 マニュアル本文（部品の配列）を組み立てて表示するだけの部分（編集・プレビュー・実際の閲覧の3か所で共用）
// v2.6.62 写真は画面幅いっぱいに大きく表示し、タップで拡大できるようにする（data-lightbox）。
// 手順は枠で囲んで、STEP番号と写真の対応がひと目で分かるようにする
function manualBlocksInnerHtml(content){
 let h="";
 (content||[]).forEach(b=>{
  if(b.type==="heading")h+=`<h3 style="margin:14px 0 6px;${manualBlockStyle(b)}">${esc(b.text||"")}</h3>`;
  else if(b.type==="text")h+=`<p style="margin:6px 0;white-space:pre-wrap;${manualBlockStyle(b)}">${esc(b.text||"")}</p>`;
  else if(b.type==="video")h+=b.url?`<p style="margin:10px 0"><a href="${esc(b.url)}" target="_blank" rel="noopener">🎬 動画を見る</a></p>`:"";
  else if(b.type==="photo")h+=(b.urls||[]).map(u=>`<img src="${esc(u)}" class="manual-photo" data-lightbox="${esc(u)}">`).join("");
  else if(b.type==="steps")h+=(b.items||[]).map((s,j)=>`<div class="manual-step"><span class="steplabel">STEP ${j+1}</span><p style="margin:8px 0 0;white-space:pre-wrap">${esc(s.text||"")}</p>${s.photo_url?`<img src="${esc(s.photo_url)}" class="manual-photo" data-lightbox="${esc(s.photo_url)}">`:""}</div>`).join("");
 });
 return h||`<p class="muted" style="margin:0">まだ部品がありません</p>`;
}
// タップで写真を全画面表示（もう一度タップで閉じる）
function openLightbox(url){
 let lb=$("lightbox");
 if(!lb){
  lb=document.createElement("div");lb.id="lightbox";
  lb.innerHTML=`<img id="lightboximg">`;
  lb.onclick=()=>{lb.style.display="none"};
  document.body.appendChild(lb);
 }
 $("lightboximg").src=url;
 lb.style.display="flex";
}

// 入力中の値をDOMから読み取ってmvEditContentに反映する（render()で画面を作り直す前に必ず呼ぶ。
// 呼ばずに構造だけ変えると、入力していた文章が消えてしまうため）
function collectBlocksDom(){
 if(!mvEditContent)return;
 mvEditContent.forEach((b,i)=>{
  if(b.type==="heading"){const el=document.querySelector(`[data-bhead="${i}"]`);if(el)b.text=el.value}
  else if(b.type==="text"){const el=document.querySelector(`[data-btext="${i}"]`);if(el)b.text=el.value}
  else if(b.type==="video"){const el=document.querySelector(`[data-bvideo="${i}"]`);if(el)b.url=el.value.trim()}
  else if(b.type==="steps"){(b.items||[]).forEach((s,j)=>{const el=document.querySelector(`[data-bstep="${i}-${j}"]`);if(el)s.text=el.value})}
 });
}

  else if(b.type==="steps"){

const SF_KIND={A:"1〜15日",B:"16〜末日"};
function sfCanManage(storeId){
 if(me.is_master||["CEO","HQ","TEAM"].includes(me.role))return true;
 if(me.role==="TENCHO")return (me.stores||[]).some(s=>s.id===storeId);
 return false;
}
function sfPickableStores(){ // storesHiddenはloadMe()でログイン時に取得済み（本部等の疑似店舗）
 if(sfCanManage(null))return [...stores,...storesHidden];
 return (me.stores||[]).filter(s=>sfCanManage(s.id));
}
function sfPeriodIdx(y,m,half){return y*24+m*2+(half==="A"?0:1)}
function sfPeriodInfo(y,m,half){ // m=0-indexed月
 if(half==="A"){
  const start=new Date(y,m,1),end=new Date(y,m,15);
  let pm=m-1,py=y;if(pm<0){pm=11;py=y-1}
  return {key:y+"-"+String(m+1).padStart(2,"0")+"-A",y,m,half,label:`${y}/${m+1}/1〜15`,start,end,deadline:new Date(py,pm,20,23,59,59),publish:new Date(py,pm,25)};
 }
 const start=new Date(y,m,16),end=new Date(y,m+1,0);
 return {key:y+"-"+String(m+1).padStart(2,"0")+"-B",y,m,half,label:`${y}/${m+1}/16〜${end.getDate()}`,start,end,deadline:new Date(y,m,5,23,59,59),publish:new Date(y,m,10)};
}
function sfPeriodFromIdx(idx){let y=Math.floor(idx/24),rem=idx-y*24;if(rem<0){rem+=24;y-=1}return sfPeriodInfo(y,Math.floor(rem/2),rem%2===0?"A":"B")}
function sfCurrentPeriod(){
 const t=new Date(),y=t.getFullYear(),m=t.getMonth(),d=t.getDate();
 if(d<=5)return sfPeriodInfo(y,m,"B");
 if(d<=20){const nm=new Date(y,m+1,1);return sfPeriodInfo(nm.getFullYear(),nm.getMonth(),"A")}
 const nm=new Date(y,m+1,1);return sfPeriodInfo(nm.getFullYear(),nm.getMonth(),"B");
}

function sfRoleTag(u){ // 表示用の区分（AL=PA、それ以外は社員扱い）
 if(u.role==="AL")return {cls:"pa",label:"PA"};
 return {cls:"emp",label:ROLE_NAME[u.role]||u.role};
}
function sfTimeToHour(t){if(!t)return 0;const parts=String(t).split(":");return (+parts[0]||0)+(+parts[1]||0)/60}
function sfShiftMinutes(s){
 if(!s||s.is_off)return 0;
 let mins=(sfTimeToHour(s.end_time)-sfTimeToHour(s.start_time))*60-(s.break_minutes||0);
 if(mins<0)mins+=24*60; // 深夜またぎ
 return Math.max(0,mins);
}
function sfDayNeedTotal(ds,presets,reqs){ // その日の必要人数合計（1件も設定が無ければnull=未設定）
 const wd=new Date(ds+"T00:00:00").getDay();
 let anySet=false,total=0;
 (presets||[]).forEach(pr=>{
  const need=(reqs||[]).find(r=>r.preset_id===pr.id&&(r.specific_date===ds||(r.specific_date===null&&r.weekday===wd)));
  if(need){anySet=true;total+=need.required_count}
 });
 return anySet?total:null;
}
function sfDayHaveTotal(ds,people,shByUserDate){
 return people.filter(u=>{const s=shByUserDate[u.id+"|"+ds];return s&&!s.is_off}).length;
}
async function sfComputeWageRates(storeId,peopleIds){ // labor_cost_daily（担当D管轄・読み取りのみ）の直近実績から時間単価を概算
 if(!peopleIds.length)return {};
 const since=sfFmtDate(new Date(Date.now()-60*86400000));
 const {data}=await sb.from("labor_cost_daily").select("user_id,worked_minutes,computed_cost,smaregi_estimate_cost").eq("store_id",storeId).gte("work_date",since).in("user_id",peopleIds);
 const agg={};
 (data||[]).forEach(r=>{
  const cost=r.computed_cost!=null?r.computed_cost:r.smaregi_estimate_cost;
  if(cost==null||!r.worked_minutes)return;
  const a=agg[r.user_id]||(agg[r.user_id]={cost:0,min:0});
  a.cost+=cost;a.min+=r.worked_minutes;
 });
 const rates={};
 Object.keys(agg).forEach(uid=>{if(agg[uid].min>0)rates[uid]=agg[uid].cost/agg[uid].min});
 return rates;
}

function sfDayGanttHtml(ds,people,shByUserDate,storeCountMap){
 const entries=people.map(u=>({u,s:shByUserDate[u.id+"|"+ds]})).filter(x=>x.s&&!x.s.is_off);
 if(!entries.length)return "";
 let minH=24,maxH=0;
 entries.forEach(({s})=>{const sh=sfTimeToHour(s.start_time),eh=sfTimeToHour(s.end_time);if(sh<minH)minH=sh;if(eh>maxH)maxH=eh});
 minH=Math.max(0,Math.floor(minH));maxH=Math.min(30,Math.ceil(maxH));
 if(maxH<=minH){minH=10;maxH=24}
 const cols=(maxH-minH)*2; // 30分刻み
 let head=`<div class="sf-ghead" style="grid-template-columns:120px repeat(${cols},1fr)"><div>従業員</div>`;
 for(let c=0;c<cols;c++)head+=`<div>${c%2===0?minH+c/2:""}</div>`;
 head+="</div>";
 const rows=entries.map(({u,s})=>{
  const multi=(storeCountMap[u.id]||1)>1,tag=sfRoleTag(u);
  const sc=Math.max(0,Math.round((sfTimeToHour(s.start_time)-minH)*2));
  const ec=Math.min(cols,Math.round((sfTimeToHour(s.end_time)-minH)*2));

 }).join("");
 return `<div class="sf-gantt-wrap"><div class="sf-gantt">${head}${rows}</div></div>`;
}

// ②調整: 4カード＋想定人件費率（売上目標=dash_sales_target_daily、時給はlabor_cost_daily直近実績からの概算）＋調整が必要な日
function sfAdjustStepHtml(ctx){
 const {dates,people,shByUserDate,presets,reqs,storeCountMap,salesTotal,wageRates,unlinkedCount,payrollByUser,allocByUser}=ctx;
 let empCost=0,paCost=0;const unknownWage=new Set(),autoFallback=new Set();
 people.forEach(u=>{
  let minutes=0;dates.forEach(ds=>{minutes+=sfShiftMinutes(shByUserDate[u.id+"|"+ds])});
  if(!minutes)return;
  const rate=wageRates[u.id];
  let cost;
  if(rate!=null){
   cost=minutes*rate; // 時給が実績から出せる人（アルバイト等）は従来通り
  }else{
   // 2026-08-29続き: 時給が算出できない人（月給制など）はsf_payroll_allocations（マスター手動振り分け）
   //   →無ければsf_payroll_sync（スマレジ給与明細APIの固定給を半月按分した自動概算）の順で使う。
   //   2026-08-30続き: 配分は月単位（半月ではない）で入力するため、半月ぶんは0.5を掛けて按分する
   const alloc=(allocByUser||{})[u.id];
   const pr=(payrollByUser||{})[u.id];
   if(alloc&&alloc.length){
    cost=alloc.reduce((a,r)=>a+Number(r.amount||0),0)*0.5;
   }else if(pr){
    cost=(Number(pr.fixed_salary_amount||0)+Number(pr.commute_allowance||0))*0.5; // 半月ぶんの概算按分（2026-08-29訂正: 固定給＝支給額合計−通勤手当）
    autoFallback.add(u.id);
   }else{
    cost=0;unknownWage.add(u.id);
   }
  }
  if(sfRoleTag(u).cls==="pa")paCost+=cost;else empCost+=cost;
 });
 const totalCost=empCost+paCost;
 const rateText=salesTotal>0?((totalCost/salesTotal*100).toFixed(1)+"%"):"算出不可";
 const needDays=[];
 dates.forEach(ds=>{
  const wd=new Date(ds+"T00:00:00").getDay();
  (presets||[]).forEach(pr=>{
   const need=(reqs||[]).find(r=>r.preset_id===pr.id&&(r.specific_date===ds||(r.specific_date===null&&r.weekday===wd)));
   if(!need)return;
   const have=people.filter(u=>{const s=shByUserDate[u.id+"|"+ds];return s&&!s.is_off&&s.preset_id===pr.id}).length;
   if(have<need.required_count)needDays.push({ds,label:pr.label,short:need.required_count-have});
  });
 });
 const checkMsgs=[];
 if(needDays.length)checkMsgs.push(`不足枠 ${needDays.length}件`);
 if(unlinkedCount)checkMsgs.push(`スマレジ未連携 ${unlinkedCount}名`);
 let h=`<div class="sf-finance">
  <div class="card"><small>売上予想</small><b>${salesTotal?Math.round(salesTotal).toLocaleString()+"円":"未設定"}</b></div>
  <div class="card"><small>社員人件費</small><b>${Math.round(empCost).toLocaleString()}円</b></div>
  <div class="card"><small>PA人件費</small><b>${Math.round(paCost).toLocaleString()}円</b></div>
  <div class="card"><small>総人件費</small><b>${Math.round(totalCost).toLocaleString()}円</b></div>
  <div class="card"><small>想定人件費率</small><b>${rateText}</b></div>
 </div>`;
 if(unknownWage.size)h+=`<div class="sf-note">⚠️ ${unknownWage.size}名は勤怠実績・給与データがまだ無いため人件費の概算に含めていません（実績が貯まる、またはスマレジ給与明細が同期されると自動的に反映されます）</div>`;
 if(autoFallback.size)h+=`<div class="sf-note">🧮 ${autoFallback.size}名は店舗別の振り分けが未設定のため、スマレジ給与明細（課税対象額＋通勤手当）の半月分を自動概算で入れています。管理画面の「給与・インセンティブ配分」で店舗ごとに金額を設定すると、そちらが優先されます</div>`;
 // 2026-08-29続き: モックアップの「調整グリッド」レイアウト（シフト表＋右に調整が必要な日）
 const reqboxHtml=`<div class="card sf-reqbox"><b>調整が必要な日</b>${needDays.length?needDays.map(d=>`<div class="sf-reqday"><b>${sfFmtDateShort(d.ds)}</b><p>${esc(d.label)} ${d.short}名不足</p></div>`).join(""):'<p class="muted" style="margin-top:6px">現在、不足している時間帯はありません</p>'}</div>`;
 // A-1(2026-08-29) KPIカードから再利用できるよう、算出済みの数値も一緒に返す
 return {html:h,reqboxHtml,checkText:checkMsgs.length?checkMsgs.join("・"):"問題ありません",totalCost,salesTotal,rateText,needCount:needDays.length};
}

// ④実績・差分: 従業員ごとの叶え率（希望vs実績）
// v2.7 バグ修正: 未来日（まだ実績が発生しようがない日）を実績0として数えると、期間の途中で見たときに
//   叶え率が不当に低く出てしまう（例: 今日以降の希望日数ぶんだけ実績0が積み上がる）。
//   希望日数・時間も「今日までの経過日」だけに絞って集計し、未来日は両側とも対象外にする
// 2026-08-29続き: モックアップの two-col（左=叶え率ランキング、右=一覧表）に合わせて
//   計算部分をsfFulfillmentDataに切り出し、ランキング用HTML・表HTMLの2つを生成できるようにした
function sfFulfillmentData(dates,people,shByUserDate,laborByUserDate){
 const today=todayStr();
 const pastDates=dates.filter(ds=>ds<=today);
 const rows=people.map(u=>{
  let wishDays=0,wishMin=0,actualDays=0,actualMin=0;
  pastDates.forEach(ds=>{
   const s=shByUserDate[u.id+"|"+ds];
   if(s&&!s.is_off){wishDays++;wishMin+=sfShiftMinutes(s)}
   const lk=laborByUserDate[u.id+"|"+ds];
   if(lk&&lk.minutes>0){actualDays++;actualMin+=lk.minutes}
  });
  return {u,wishDays,actualDays,wishMin,actualMin};
 }).filter(r=>r.wishDays>0||r.actualDays>0).sort((a,b)=>(b.wishDays?b.actualDays/b.wishDays:0)-(a.wishDays?a.actualDays/a.wishDays:0));
 return {pastDates,rows};
}

//   （tardy/early_leavingはスマレジ側で判定済みの値をそのまま使う。行が無ければ欠勤扱い）。
//   実際のスマレジ側打刻データの書き換えは対象外（timecard.attendances:write未申請のため）。
//   修正申請は受付・一覧・承認/却下までを実装し、承認後の反映は店長・本部が手動で行う運用
const CORRECTION_KIND_LABEL={late:"遅刻",early_leave:"早退",absence:"欠勤",other:"その他"};
function sfAttendanceIssuesHtml(dates,people,shByUserDate,laborByUserDate,storeId,corrections){
 const today=todayStr();
 const issues=[];
 people.forEach(u=>{
  dates.forEach(ds=>{
   if(ds>=today)return; // 未来日・当日は判定しない（当日はまだ勤務中の可能性がある）
   const s=shByUserDate[u.id+"|"+ds];
   if(!s||s.is_off||s.status!=="published")return; // 公開済みの出勤予定がある日だけ判定
   const lk=laborByUserDate[u.id+"|"+ds];
   if(!lk||!lk.minutes){issues.push({u,ds,kind:"absence"});return}
   if(lk.tardy)issues.push({u,ds,kind:"late"});
   if(lk.early)issues.push({u,ds,kind:"early_leave"});
  });
 });
 const canManage=sfCanManage(storeId);
 const pending=(corrections||[]).filter(c=>c.status==="pending");
 let h=`<div class="card"><h3 style="margin:0 0 8px">⏰ 遅刻・早退・欠勤（自動判定）</h3>`;
 if(!issues.length){
  h+=`<p class="muted" style="margin:0">対象期間・対象店舗で検知した遅刻・早退・欠勤はありません</p>`;
 }else{
  h+=issues.map(is=>{
   const mine=is.u.id===me.id;
   const already=(corrections||[]).find(c=>c.user_id===is.u.id&&c.work_date===is.ds&&c.kind===is.kind);
   return `<div class="row" style="cursor:default"><span><b>${esc(is.u.name)}</b>　${sfFmtDateShort(is.ds)}　<span class="badge" style="background:${is.kind==="absence"?"#c0392b":"#d97706"}">${CORRECTION_KIND_LABEL[is.kind]}</span>${already?` <span class="muted" style="font-size:11px">（申請${already.status==="pending"?"中":already.status==="approved"?"承認済み":"却下"}）</span>`:""}</span>
    ${mine&&!already?`<button class="btn sm sub" data-sfcorr-open="${is.u.id}|${is.ds}|${is.kind}" style="margin:0">修正申請</button>`:""}</div>`;
  }).join("");
 }
 if(sfCorrectionEditKey){
  const [,ds,kind]=sfCorrectionEditKey.split("|");
  h+=`<div style="margin-top:10px;border-top:1px solid var(--line);padding-top:10px">
   <h3 style="margin:0 0 8px">${sfFmtDateShort(ds)}の修正申請</h3>
   <select class="inp" id="sfcorr-kind">${Object.entries(CORRECTION_KIND_LABEL).map(([k,l])=>`<option value="${k}" ${k===kind?"selected":""}>${l}</option>`).join("")}</select>
   <textarea id="sfcorr-reason" rows="3" placeholder="打刻がおかしい理由を書いてください（例: 12:00出勤だが打刻漏れで記録されていない）"></textarea>
   <p class="muted" style="margin:6px 0 0;font-size:11px">承認後、実際のスマレジ側の打刻修正は店長・本部が手動で行います</p>
   <div style="margin-top:8px;display:flex;gap:8px">
    <button class="btn sm" id="sfcorr-send">送信する</button>
    <button class="btn sm sub" id="sfcorr-close">閉じる</button>
   </div>
  </div>`;
 }
 h+=`</div>`;
 if(canManage&&pending.length){
  h+=`<div class="card"><h3 style="margin:0 0 8px">📋 勤怠修正申請（未対応 ${pending.length}件）</h3>`;
  h+=pending.map(c=>{
   const u=people.find(x=>x.id===c.user_id);
   return `<div style="padding:8px 0;border-bottom:1px solid var(--line,#eee)">
    <div><b>${esc(u?u.name:"?")}</b>　${sfFmtDateShort(c.work_date)}　<span class="badge" style="background:#d97706">${CORRECTION_KIND_LABEL[c.kind]||c.kind}</span></div>
    <div class="muted" style="margin:3px 0">${esc(c.reason||"")}</div>
    <div style="display:flex;gap:6px"><button class="btn sm" data-sfcorr-approve="${c.id}">承認</button><button class="btn sm sub" data-sfcorr-reject="${c.id}">却下</button></div>
   </div>`;
  }).join("");
  h+=`</div>`;
 }
 return h;
}

 }

}

// ---- 保存処理（共通） ----
async function sfSaveDay(uid,storeId,ds,periodKey,presetId,isOff,startT,endT,presets){
 let start=startT,end=endT,breakMin=0,pid=presetId||null;
 if(isOff){start=null;end=null}
 else if(pid){const pr=presets.find(x=>x.id===pid);if(pr){start=start||pr.start_time;end=end||pr.end_time;breakMin=pr.break_minutes}}
 if(!isOff&&(!start||!end)){toast("時間を入力してください",true);return false}
 const payload={user_id:uid,store_id:storeId,work_date:ds,period_key:periodKey,preset_id:pid,is_off:!!isOff,
  start_time:isOff?"00:00":start,end_time:isOff?"00:00":end,break_minutes:breakMin,status:"draft",created_by:me.id,updated_at:new Date().toISOString()};
 const {error}=await sb.from("sf_shifts").upsert(payload,{onConflict:"user_id,work_date"});
 if(error){toast("保存エラー: "+error.message,true);return false}
 return true;
}
// v2.6.82 削除（一度登録した内容を消して未入力に戻す）。スマレジに反映済みならAPI側も削除してから消す
async function sfDeleteDay(uid,ds){
 const {data:cur}=await sb.from("sf_shifts").select("id,smaregi_shift_result_id").eq("user_id",uid).eq("work_date",ds).maybeSingle();
 if(!cur)return true;
 if(cur.smaregi_shift_result_id){
  const {data:sess}=await sb.auth.getSession();
  const token=sess&&sess.session?sess.session.access_token:null;
  try{
   const r=await fetch(SUPA_URL+"/functions/v1/smaregi-shift-sync",{method:"POST",headers:{Authorization:"Bearer "+token,"Content-Type":"application/json"},body:JSON.stringify({action:"delete_one",shift_id:cur.id})});
   const j=await r.json().catch(()=>null);
   if(!j||!j.ok){toast("削除エラー: "+(j&&j.error?j.error:"スマレジ側の削除に届きませんでした"),true);return false}
   return true;
  }catch(e){toast("削除エラー: スマレジ側の削除に届きませんでした",true);return false}
 }
 const {error:delErr}=await sb.from("sf_shifts").delete().eq("id",cur.id);
 if(delErr){toast("削除エラー: "+delErr.message,true);return false}
 return true;
}

function ageOf(uid){
 const p=adminProfs[uid];
 if(!p||!p.birth_date)return null;
 const d=new Date(p.birth_date);
 if(isNaN(d.getTime()))return null;
 const now=new Date();
 let age=now.getFullYear()-d.getFullYear();
 const m=now.getMonth()-d.getMonth();
 if(m<0||(m===0&&now.getDate()<d.getDate()))age--;
 return (age>=0&&age<120)?age:null;
}

async function rcEnsureInterviewNotify(){

 if(sessionStorage.getItem("rc_ivnotify_checked_"+today))return; // 同じセッション内で2回叩かない（最終防衛はDB側の重複チェック）
 sessionStorage.setItem("rc_ivnotify_checked_"+today,"1");
 try{
  const dayStart=today+"T00:00:00",dayEnd=today+"T23:59:59";
  const {data:list}=await sb.from("applicants").select("id,name,interview_at,assignee_id")
   .gte("interview_at",dayStart).lte("interview_at",dayEnd).in("status",["interview_set","interviewed"]);
  if(!list||!list.length)return;
  const byAssignee={};
  list.forEach(a=>{if(a.assignee_id)(byAssignee[a.assignee_id]=byAssignee[a.assignee_id]||[]).push(a)});
  const recips=Object.keys(byAssignee);
  if(!recips.length)return;
  // 重複防止: 今日すでにこの宛先へ送っていれば送らない
  const {data:already}=await sb.from("notifications").select("recipient_id").eq("type","interview_today")
   .gte("created_at",dayStart).lte("created_at",dayEnd).in("recipient_id",recips);
  const doneSet=new Set((already||[]).map(x=>x.recipient_id));
  const rows=recips.filter(r=>!doneSet.has(r)).map(r=>{
   const items=byAssignee[r].sort((a,b)=>(a.interview_at||"").localeCompare(b.interview_at||""));
   const lines=items.map(a=>`・${fmtDue(a.interview_at).split(" ")[1]} ${a.name}さん`).join("\n");
   return {recipient_id:r,type:"interview_today",body_i18n:{ja:`📅 本日の面接予定（${items.length}件）\n${lines}`},link:{rc_date:today}};
  });
  if(rows.length)await sb.from("notifications").insert(rows);
 }catch(e){} // 失敗しても応募者管理の表示は妨げない
}

function parseCsv(text){
 const rows=[];let cur=[],val="",q=false;
 text=String(text||"").replace(/^\uFEFF/,"");
 for(let i=0;i<text.length;i++){
  const c=text[i];
  if(q){ if(c==='"'){ if(text[i+1]==='"'){val+='"';i++} else q=false } else val+=c }
  else if(c==='"')q=true;
  else if(c===","){cur.push(val);val=""}
  else if(c==="\n"){cur.push(val);rows.push(cur);cur=[];val=""}
  else if(c!=="\r")val+=c;
 }
 if(val!==""||cur.length){cur.push(val);rows.push(cur)}
 return rows.filter(r=>r.some(x=>String(x).trim()));
}
function csvPhone(s){ // '+81 70 1234 5678 → 070-1234-5678（海外番号はそのまま）
 let t=String(s||"").replace(/^'/,"").trim();
 if(!t)return "";
 const d=t.replace(/[^0-9]/g,"");
 if(/^81/.test(d)&&d.length>=11){
  const n="0"+d.slice(2);
  if(n.length===11)return n.slice(0,3)+"-"+n.slice(3,7)+"-"+n.slice(7);
  if(n.length===10)return n.slice(0,2)+"-"+n.slice(2,6)+"-"+n.slice(6);
  return n;
 }
 return t.replace(/\s+/g," ");
}
const csvNormName=s=>String(s||"").replace(/[\s　]/g,"").toLowerCase();
const csvNormPhone=s=>{const d=String(s||"").replace(/[^0-9]/g,"");return /^81/.test(d)&&d.length>=11?"0"+d.slice(2):d};
function readRecruitCsv(file){
 const rd=new FileReader();
 rd.onload=()=>{
  try{
   const rows=parseCsv(rd.result);
   if(rows.length<2){toast("データが入っていないようです",true);return}
   const head=rows[0].map(h=>String(h).trim());
   const col=(...names)=>{for(const n of names){const i=head.findIndex(h=>h.includes(n));if(i>=0)return i}return -1};
   const ix={name:col("名前","氏名"),email:col("メール"),phone:col("電話"),status:col("ステータス"),
    address:col("居住地","住所"),exp:col("関連のある経験","経験"),edu:col("学歴"),
    job:col("職種"),loc:col("勤務地"),date:col("日付","応募日"),src:col("応募経路","経路")};
   if(ix.name<0){toast("「名前」の列が見つかりません。IndeedのCSVかご確認ください",true);return}
   const g=(r,i)=>i>=0?String(r[i]||"").trim():"";
   const byPhone={},byName={},byMail={};
   (rcList||[]).forEach(a=>{
    const p=csvNormPhone(a.phone);if(p&&!byPhone[p])byPhone[p]=a;
    const n=csvNormName(a.name);if(n&&!byName[n])byName[n]=a;
    const m=(a.email||"").toLowerCase();if(m&&!byMail[m])byMail[m]=a;
   });
   const out=[];
   rows.slice(1).forEach(r=>{
    const name=g(r,ix.name);if(!name)return;
    const phone=csvPhone(g(r,ix.phone)),email=g(r,ix.email);
    const m=byPhone[csvNormPhone(phone)]||byName[csvNormName(name)]||byMail[email.toLowerCase()]||null;
    out.push({name,email,phone,status:g(r,ix.status),address:g(r,ix.address),exp:g(r,ix.exp),
     edu:g(r,ix.edu),job:g(r,ix.job),loc:g(r,ix.loc),date:g(r,ix.date),src:g(r,ix.src),_match:m});
   });
   if(!out.length){toast("取り込める行がありませんでした",true);return}
   csvRows=out;render();
  }catch(e){toast("読み込みエラー: "+e.message,true)}
 };
 rd.readAsText(file);
}

async function saveStores(){
 collectStoresDom();
 if(stList.some(s=>!s.name)){toast("店舗名を入力してください",true);return}
 $("st-save").disabled=true;
 for(const [i,s] of stList.entries()){
  const {error}=await sb.from("stores").update({name:s.name,sort_order:i+1,is_active:s.is_active,smaregi_store_id:s.smaregi_store_id||null,interviewer_id:s.interviewer_id||null,dash_store_name:s.dash_store_name||null,nearest_station:s.nearest_station||null,corporation_id:s.corporation_id||null,signs:s.signs.length?s.signs:null,weather_lat:s.weather_lat,weather_lon:s.weather_lon,seisan_target:s.seisan_target,seisan_store_name:s.seisan_store_name||null}).eq("id",s.id); // v2.6.85 lark_enabledは参照しない（配信グループ所属へ移行。列は残す）／v2.6.86 精算システム側の店舗名
  if(error){toast("保存エラー: "+error.message,true);$("st-save").disabled=false;return}
  // v2.6.84 別名は差分だけstore_aliasesへ反映（追加分はinsert、削除分はdelete。既存の日報/正準ソースは通常触らない想定）
  const added=s.aliases.filter(a=>!s.aliasesOrig.includes(a));
  const removed=s.aliasesOrig.filter(a=>!s.aliases.includes(a));
  if(added.length){const {error:ae}=await sb.from("store_aliases").upsert(added.map(alias=>({store_id:s.id,alias,source:"手動"})),{onConflict:"alias"});if(ae){toast(`別名の保存エラー(${s.name}): `+ae.message,true);$("st-save").disabled=false;return}}
  if(removed.length){const {error:re}=await sb.from("store_aliases").delete().eq("store_id",s.id).in("alias",removed);if(re){toast(`別名の削除エラー(${s.name}): `+re.message,true);$("st-save").disabled=false;return}}
  // v2.6.85 配信グループ所属も差分だけreport_channel_storesへ反映
  const chAdded=s.channels.filter(c=>!s.channelsOrig.includes(c));
  const chRemoved=s.channelsOrig.filter(c=>!s.channels.includes(c));
  if(chAdded.length){const {error:cae}=await sb.from("report_channel_stores").upsert(chAdded.map(channel_id=>({channel_id,store_id:s.id})),{onConflict:"channel_id,store_id"});if(cae){toast(`配信グループの保存エラー(${s.name}): `+cae.message,true);$("st-save").disabled=false;return}}
  if(chRemoved.length){const {error:cre}=await sb.from("report_channel_stores").delete().eq("store_id",s.id).in("channel_id",chRemoved);if(cre){toast(`配信グループの削除エラー(${s.name}): `+cre.message,true);$("st-save").disabled=false;return}}
 }
 const {data:st2}=await sb.from("stores").select("id,name").eq("is_active",true).order("sort_order");
 if(st2)stores=st2;
 toast("店舗を保存しました");
 stList=null;corpList=null;adminMode="list";render();
}

// v1.7: スマレジスタッフへの招待発行（メール送信 or リンクコピー）
async function smaregiInviteDo(sendEmail){
 if(!smRole){toast("役職を選んでください",true);return}
 const btn=$(sendEmail?"sm-mail":"sm-link");if(btn){btn.disabled=true;btn.textContent="処理中..."}
 try{
  const {data:{session}}=await sb.auth.getSession();
  const res=await fetch(SUPA_URL+"/functions/v1/smaregi-sync",{
   method:"POST",
   headers:{Authorization:"Bearer "+(session?session.access_token:SUPA_KEY),apikey:SUPA_KEY,"Content-Type":"application/json"},
   body:JSON.stringify({action:"invite",staff_id:smSel.staffId,role:smRole,store_ids:smStores,days:+$("sm-days").value,send_email:sendEmail})});
  const r=await res.json();
  if(!r||!r.ok){toast("エラー: "+String((r&&(typeof r.error==="string"?r.error:JSON.stringify(r.error)))||"不明"),true);if(btn){btn.disabled=false;btn.textContent=sendEmail?"📧 招待メールを送信する":"🔗 招待リンクを発行してコピー"}return}
  if(sendEmail&&r.emailed)smResult={msg:r.mail+" に招待メールを送信しました",url:r.url};
  else if(sendEmail)smResult={msg:"招待リンクは発行しましたが、メール送信に失敗しました（"+String(r.email_error||"不明")+"）。リンクを本人に送ってください",url:r.url};
  else{smResult={msg:"招待リンクを発行しました。LINE等で本人に送ってください",url:r.url};copyText(r.url)}
  smSel=null;render();
 }catch(e){toast("エラー: "+e,true);if(btn){btn.disabled=false}}
}

// v2.6.66 交通費（表示専用）。本人の最寄り駅×所属店舗（最初の1つ）の最寄り駅から、押したときだけ計算する
function fareCardHtml(u,prof){
 const myStation=(prof.extra&&prof.extra["最寄り駅"])||"";
 const storeId=(adminStoresMap[u.id]||[])[0];
 const store=storeId?stores.find(s=>s.id===storeId):null;
 const storeStation=store&&store.nearest_station;
 const cached=fareCache[u.id];
 let body;
 if(!myStation){
  body=`<p class="muted" style="margin:0">本人の最寄り駅が入力されていないため計算できません</p>`;
 }else if(!store){
  body=`<p class="muted" style="margin:0">所属店舗が未設定のため計算できません</p>`;
 }else if(!storeStation){
  body=`<p class="muted" style="margin:0">${esc(store.name)}の最寄り駅が未設定です（管理 →「店舗管理」で登録してください）</p>`;
 }else if(cached&&cached.ok){
  body=`<p style="margin:0"><b style="font-size:18px">¥${cached.fare.toLocaleString()}</b>　${esc(cached.from_station)}駅 → ${esc(cached.to_station)}駅（片道・最安）</p>
   <button class="btn sm sub" data-farecalc="${u.id}" style="margin-top:8px">🔄 計算し直す</button>`;
 }else if(cached&&!cached.ok){
  body=`<p class="alert" style="margin:0">${esc(cached.error||"計算できませんでした")}</p>
   <button class="btn sm sub" data-farecalc="${u.id}" style="margin-top:8px">🔄 もう一度試す</button>`;
 }else{
  body=`<p class="muted" style="margin:0 0 8px">${esc(myStation)}駅 → ${esc(storeStation)}駅（${esc(store.name)}）の最安運賃を調べます</p>
   <button class="btn sm sub" data-farecalc="${u.id}">🔄 交通費を計算する</button>`;
 }
 return `<div class="card"><h3>🚃 通勤の交通費（表示専用・自動計算）</h3>${body}</div>`;
}

function goToPage(p){page=p;detail=null;editId=null;adminMode="list";adminDetail=null;lastIssued=null;lastInvite=null;setMode="main";smSel=null;smResult=null;smStaffsCache=null;tskEdit=null;chatRoom=null;chatNew=null;chatDraft="";chatFiles=[];chatQ="";tskQ="";chatReply=null;chatInvite=false;chatInviteSel=[];rcDetail=null;rcJobs=false;rcMsgs=null;rcDup=false;rcSimilar=[];rcPast=[];rcCal=false;rcCalDay=null;unlockedScoreKeys={};render()} // v2.6.76 予算ロック解除の状態もリセット

// tori-dashboard向けに担当Fが用意したpostMessage({type:'nsPortalSetTab', tab:...})と同じ契約に合わせてある
// （portal.html側がnippoグループにもこの送信を対応させた時点で、nippo側は無改修でそのまま効くようになる想定）
window.addEventListener("message",e=>{
 if(e.origin!=="https://mirai-oss.github.io")return; // 送信元を統合ポータルシェルに限定
 const d=e.data;
 if(!d||d.type!=="nsPortalSetTab")return;
 const p=d.tab;
 if(!me||!DEEPLINK_PAGES.includes(p))return; // ログイン前・未知のページキーは無視
 if(me.role==="GAIHAN"&&GAIHAN_HIDDEN_PAGES.includes(p))return;
 goToPage(p);
});

 // v2.6.35 面接日時の確定（希望日時のタップ・自由入力のどちらも同じ処理）
 const ivConfirm=async iso=>{
  const a=rcList.find(x=>x.id===rcDetail);if(!a)return;
  const field=($("rc-ivurl")&&$("rc-ivurl").value.trim())||"";
  // v2.6.40 欄には保存済みのURLが最初から入っている。
  // それを「手で貼った」と誤解して自動発行を飛ばしていたため、日時を変えても予定が直らなかった。
  // 中身を書き換えたときだけ、手入力として扱う
  const modeEl=document.querySelector(".chip.ivmodepick.on");
  const mode=modeEl?modeEl.dataset.mode:(a.interview_mode||"online");
  const placeName=($("rc-ivplace")&&$("rc-ivplace").value)||"";
  const place=ivPlaceOf(placeName);
  if(mode==="onsite"&&!placeName){toast("面接場所を選んでください",true);return}
  const manual=field&&field!==(a.interview_url||"")&&mode!=="onsite";
  // v2.6.64 面接担当（応募者カードの「担当」欄）の名前をカレンダーの予定名の先頭に入れる
  const interviewer=a.assignee_id?taskUserName(a.assignee_id):"";
  const meetOpts={mode,place:placeName,address:(place&&place.address)||"",interviewer};
  // v2.6.64 対面もカレンダーの予定を作る（場所を入れるため）。
  //   オンライン⇔対面の切り替えのときは、古い予定（Meetの有無が違う）をいったん消してから作り直す
  const modeChanged=!!(a.interview_event_id&&a.interview_mode&&a.interview_mode!==mode);
  if(modeChanged)await gasDeleteEvent(a.interview_event_id);
  const m=manual?{url:field,event_id:a.interview_event_id||""}
        :await makeMeet(a,iso,{...meetOpts,forceNew:modeChanged});
  const url=m.url;
  const {error}=await sb.rpc("set_interview",{p_applicant:a.id,p_at:iso,p_url:url||null,
   p_mode:mode,p_place:placeName||null,p_address:(place&&place.address)||null});
  if(error){toast("確定できませんでした: "+error.message,true);return}
  await saveEventId(a.id,m.event_id);
  // v2.6.44 LINE連携済みなら、確定と同時にご案内（面接URL入り）を自動送信する
  let sent="";
  if(a.line_user_id){
   const txt=interviewText({...a,interview_at:iso,interview_url:url,
    interview_mode:mode,interview_place:placeName,interview_address:(place&&place.address)||""});
   const r=await lineFn({action:"push",applicant_id:a.id,text:txt});
   if(r.ok){
    try{await sb.rpc("line_claim_last_out",{p_applicant:a.id})}catch(e){}
    try{await sb.rpc("mark_interview_sent",{p_applicant:a.id})}catch(e){}
    sent="／LINEでご案内を送りました";
   }else{
    toast("確定しましたが、LINEを送れませんでした: "+(r.error||"不明"),true);
   }
  }
  // v2.6.64 対面でも予定は作っている（URLが無いのは正常）ので、event_idの有無で伝える
  const calMsg=url?(m.updated?"カレンダーの予定も直しました":"URLを発行しました")
    :(m.event_id?(m.updated?"カレンダーの予定も直しました":"カレンダーに予定を作りました"):"");
  toast(("面接日時を確定しました"+(calMsg?"／"+calMsg:""))+sent);
  rcList=null;rcSimilar=[];rcPast=[];render();
 };

 if($("eu-resend"))$("eu-resend").onclick=async()=>{ // v2.6.14

 // v2.6.8 退職日
 const saveTerm=async(d)=>{
  const btn=$(d?"eu-termsave":"eu-termclear");if(btn)btn.disabled=true;
  const {data,error}=await sb.rpc("set_employee_termination",{p_user:adminDetail,p_date:d});
  if(error){toast("保存エラー: "+error.message,true);if(btn)btn.disabled=false;return}
  let sm="";
  try{
   const r=await smaregiTerminate(adminDetail,d);
   sm=r&&r.ok?(r.skipped?"（スマレジは未連携）":"／スマレジにも反映しました"):"／スマレジ反映に失敗（後で再実行してください）";
  }catch(e){sm="／スマレジ反映に失敗"}
  const apps=(data&&data.applicants)||0;
  toast(d?`退職日を保存しました${apps?"／応募者の状況を退職に更新":""}${sm}`:`退職を取り消しました${sm}`);
  adminMode="list";adminDetail=null;adminUsers=null;rcList=null;rcHiredInfo=null;render();
 };
 if($("eu-termsave"))$("eu-termsave").onclick=()=>{
  const d=$("eu-term").value;
  if(!d){toast("退職日を選んでください",true);return}
  if(!confirm(`退職日を ${d} に設定します。\n\n・アカウントが使えなくなります\n・スマレジ・タイムカードにも登録され、打刻できなくなります\n・応募者管理の状況が「退職」になります\n\nよろしいですか？`))return;
  saveTerm(d);
 };
 if($("eu-termclear"))$("eu-termclear").onclick=()=>{
  if(!confirm("退職を取り消して、アカウントを使える状態に戻します。よろしいですか？"))return;
  saveTerm(null);
 };
 // v2.6.0 完全削除
 if($("eu-del"))$("eu-del").onclick=async()=>{
  const {data:info,error}=await sb.rpc("delete_user_completely",{p_user:adminDetail,p_confirm:false});
  if(error){toast("エラー: "+error.message,true);return}
  const n=[["日報",info.reports],["フィードバック",info.comments],["タスク",info.tasks],["タスクのコメント",info.task_comments],["チャット発言",info.messages],["添付ファイル",info.files]].filter(x=>x[1]>0);
  const detail=n.length?"\n\n一緒に削除されるもの:\n"+n.map(x=>`・${x[0]} ${x[1]}件`).join("\n"):"\n\n（関連データはありません）";
  if(!confirm(`${info.name}さんを完全に削除します。元に戻せません。${detail}\n\n本当に削除しますか？`))return;
  if(n.length&&!confirm(`最終確認です。\n${info.name}さんの記録もすべて消えます。よろしいですか？`))return;
  $("eu-del").disabled=true;
  const {data:res,error:e2}=await sb.rpc("delete_user_completely",{p_user:adminDetail,p_confirm:true});
  if(e2){toast("削除エラー: "+e2.message,true);$("eu-del").disabled=false;return}
  toast(`${(res&&res.name)||""}さんを完全に削除しました`);
  adminMode="list";adminDetail=null;adminUsers=null;render();
 };

 if($("pf-station"))$("pf-station").onclick=()=>showStations("pf-stationbox","pf-addr");
 if($("pf-save"))$("pf-save").onclick=async()=>{
  const ph=$("pf-phone").value.trim(),eph=$("pf-ephone").value.trim();
  if(ph&&!phoneOk(ph)){toast("電話番号の桁数をご確認ください（10桁または11桁）",true);return}
  if(eph&&!phoneOk(eph)){toast("緊急連絡先の桁数をご確認ください",true);return}
  const name=$("pf-name").value.trim();
  if(!name){toast("氏名を入力してください",true);return}
  $("pf-save").disabled=true;
  const {error}=await sb.rpc("update_my_profile",{p_name:name,p_name_kana:$("pf-kana").value.trim()||null,
   p_phone:$("pf-phone").value.trim()||null,p_postal_code:$("pf-zip").value.trim()||null,p_address:$("pf-addr").value.trim()||null,
   p_emergency_name:$("pf-ename").value.trim()||null,p_emergency_relation:$("pf-erel").value.trim()||null,p_emergency_phone:$("pf-ephone").value.trim()||null});
  $("pf-save").disabled=false;
  if(error){toast("保存エラー: "+error.message,true);return}
  // v2.6.48 生年月日と最寄り駅も保存する（update_my_profile では扱えないため直接更新）
  const birth=$("pf-birth")?$("pf-birth").value:"";
  const st=pickedStation("pf-stationbox");
  if(birth||st){
   const rec={user_id:me.id,updated_at:new Date().toISOString()};
   if(birth)rec.birth_date=birth;
   if(st){
    const {data:cur}=await sb.from("employee_profiles").select("extra").eq("user_id",me.id).maybeSingle();
    rec.extra=Object.assign({},(cur&&cur.extra)||{},{最寄り駅:st});
   }
   const {error:e2}=await sb.from("employee_profiles").upsert(rec,{onConflict:"user_id"});
   if(e2){toast("生年月日・最寄り駅を保存できませんでした: "+e2.message,true);return}
  }
  me.name=name;myProf=null;toast("プロフィールを保存しました");render();
 };
 if($("pf-pwsave"))$("pf-pwsave").onclick=async()=>{
  const pw=$("pf-pw").value,pw2=$("pf-pw2").value;
  if(pw.length<8){toast("パスワードは8文字以上にしてください",true);return}
  if(pw!==pw2){toast("確認用のパスワードが一致しません",true);return}
  $("pf-pwsave").disabled=true;
  const {error}=await sb.auth.updateUser({password:pw});
  $("pf-pwsave").disabled=false;
  if(error){toast("変更エラー: "+error.message,true);return}
  $("pf-pw").value="";$("pf-pw2").value="";toast("パスワードを変更しました");
 };
