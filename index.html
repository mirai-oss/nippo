// v2.6.2 日報・週報をLark用のテキストに整形
function reportToText(rp){
 const fmt=rp.kind==="weekly"?weeklyFmt():fmtAll(me.role);
 const store=(me.stores[0]&&me.stores[0].name)||"";
 let t=`📝 ${me.name}さん（${ROLE_NAME[me.role]||""}）の${rp.kind==="weekly"?"週報":"日報"}　${fmtDate(rp.report_date)}`;
 if(store)t+=`\n🏪 ${store}`;
 const seen={};
 fmt.forEach(f=>{
  if(seen[f.k])return;seen[f.k]=1;
  const v=(rp.answers||{})[f.k];
  if(v==null||v===""||(Array.isArray(v)&&!v.length))return;
  let s;
  if(f.type==="stars")s="★".repeat(+v||0)+"☆".repeat(Math.max(0,5-(+v||0)));
  else if(f.type==="num")s=v+"点";
  else if(f.type==="photo")s=`写真${(Array.isArray(v)?v.length:1)}枚`;
  else if(Array.isArray(v))s=v.join("、");
  else s=String(v);
  s=s.trim();if(!s)return;
  t+=`\n\n【${f.label}】\n${s.length>400?s.slice(0,400)+"…":s}`;
 });
 return t;
}

// ===== v2.6.5 CSV取り込み =====
function parseCsv(text){
 const rows=[];let cur=[],val="",q=false;
 text=String(text||"").replace(/^\uFEFF/,"");
 for(let i=0;i<text.length;i++){
  const c=text[i];
  if(q){ if(c==='"'){ if(text[i+1]==='"'){val+='"';i++} else q=false } else val+=c }
  else if(c==='"')q=true;
  else if(c===","){cur.push(val);val=""}
  else if(c==="\n"){cur.push(val);rows.push(cur);cur=[];val=""}
  else if(c!=="\r")val+=c;
 }
 if(val!==""||cur.length){cur.push(val);rows.push(cur)}
 return rows.filter(r=>r.some(x=>String(x).trim()));
}
function csvPhone(s){ // '+81 70 1234 5678 → 070-1234-5678（海外番号はそのまま）
 let t=String(s||"").replace(/^'/,"").trim();
 if(!t)return "";
 const d=t.replace(/[^0-9]/g,"");
 if(/^81/.test(d)&&d.length>=11){
  const n="0"+d.slice(2);
  if(n.length===11)return n.slice(0,3)+"-"+n.slice(3,7)+"-"+n.slice(7);
  if(n.length===10)return n.slice(0,2)+"-"+n.slice(2,6)+"-"+n.slice(6);
  return n;
 }
 return t.replace(/\s+/g," ");
}
const csvNormName=s=>String(s||"").replace(/[\s　]/g,"").toLowerCase();
const csvNormPhone=s=>{const d=String(s||"").replace(/[^0-9]/g,"");return /^81/.test(d)&&d.length>=11?"0"+d.slice(2):d};
function readRecruitCsv(file){
 const rd=new FileReader();
 rd.onload=()=>{
  try{
   const rows=parseCsv(rd.result);
   if(rows.length<2){toast("データが入っていないようです",true);return}
   const head=rows[0].map(h=>String(h).trim());
   const col=(...names)=>{for(const n of names){const i=head.findIndex(h=>h.includes(n));if(i>=0)return i}return -1};
   const ix={name:col("名前","氏名"),email:col("メール"),phone:col("電話"),status:col("ステータス"),
    address:col("居住地","住所"),exp:col("関連のある経験","経験"),edu:col("学歴"),
    job:col("職種"),loc:col("勤務地"),date:col("日付","応募日"),src:col("応募経路","経路")};
   if(ix.name<0){toast("「名前」の列が見つかりません。IndeedのCSVかご確認ください",true);return}
   const g=(r,i)=>i>=0?String(r[i]||"").trim():"";
   const byPhone={},byName={},byMail={};
   (rcList||[]).forEach(a=>{
    const p=csvNormPhone(a.phone);if(p&&!byPhone[p])byPhone[p]=a;
    const n=csvNormName(a.name);if(n&&!byName[n])byName[n]=a;
    const m=(a.email||"").toLowerCase();if(m&&!byMail[m])byMail[m]=a;
   });
   const out=[];
   rows.slice(1).forEach(r=>{
    const name=g(r,ix.name);if(!name)return;
    const phone=csvPhone(g(r,ix.phone)),email=g(r,ix.email);
    const m=byPhone[csvNormPhone(phone)]||byName[csvNormName(name)]||byMail[email.toLowerCase()]||null;
    out.push({name,email,phone,status:g(r,ix.status),address:g(r,ix.address),exp:g(r,ix.exp),
     edu:g(r,ix.edu),job:g(r,ix.job),loc:g(r,ix.loc),date:g(r,ix.date),src:g(r,ix.src),_match:m});
   });
   if(!out.length){toast("取り込める行がありませんでした",true);return}
   csvRows=out;render();
  }catch(e){toast("読み込みエラー: "+e.message,true)}
 };
 rd.readAsText(file);
}

// v1.7: スマレジスタッフへの招待発行（メール送信 or リンクコピー）
async function smaregiInviteDo(sendEmail){
 if(!smRole){toast("役職を選んでください",true);return}
 const btn=$(sendEmail?"sm-mail":"sm-link");if(btn){btn.disabled=true;btn.textContent="処理中..."}
 try{
  const {data:{session}}=await sb.auth.getSession();
  const res=await fetch(SUPA_URL+"/functions/v1/smaregi-sync",{
   method:"POST",
   headers:{Authorization:"Bearer "+(session?session.access_token:SUPA_KEY),apikey:SUPA_KEY,"Content-Type":"application/json"},
   body:JSON.stringify({action:"invite",staff_id:smSel.staffId,role:smRole,store_ids:smStores,days:+$("sm-days").value,send_email:sendEmail})});
  const r=await res.json();
  if(!r||!r.ok){toast("エラー: "+String((r&&(typeof r.error==="string"?r.error:JSON.stringify(r.error)))||"不明"),true);if(btn){btn.disabled=false;btn.textContent=sendEmail?"📧 招待メールを送信する":"🔗 招待リンクを発行してコピー"}return}
  if(sendEmail&&r.emailed)smResult={msg:r.mail+" に招待メールを送信しました",url:r.url};
  else if(sendEmail)smResult={msg:"招待リンクは発行しましたが、メール送信に失敗しました（"+String(r.email_error||"不明")+"）。リンクを本人に送ってください",url:r.url};
  else{smResult={msg:"招待リンクを発行しました。LINE等で本人に送ってください",url:r.url};copyText(r.url)}
  smSel=null;render();
 }catch(e){toast("エラー: "+e,true);if(btn){btn.disabled=false}}
}

 if(!cfgFmts[fmtRole])cfgFmts[fmtRole]=JSON.parse(JSON.stringify(fmtRole==="WEEKLY"?WEEKLY_FMT:(FORMATS[fmtRole]||[])));
 return cfgFmts[fmtRole];
}
function settingsFmtView(){
 const list=curFmtList();
 let h=`<span class="back" id="setback">← 設定</span><h2>日報・週報の項目設定</h2>
  <div class="card" style="padding:12px">${["AL","SHAIN","TENCHO","TEAM","HQ","WEEKLY"].map(r=>
   `<span class="chip fmtrole ${fmtRole===r?"on":""}" data-r="${r}">${r==="WEEKLY"?"週報（共通）":ROLE_NAME[r]}</span>`).join("")}</div>`;
 h+=`<p class="muted" style="font-size:12px">⠿ をドラッグ、または ↑↓ で並び替えできます。</p>`;
 h+=list.map((f,i)=>`<div class="card fcard" data-fi="${i}" style="padding:12px">
  <div style="display:flex;gap:6px;margin-bottom:8px;align-items:center">
   <span class="fhandle" draggable="true" data-fi="${i}" title="ドラッグで並び替え">⠿</span>
   <span class="fnum">${i+1}</span>
   <input type="text" data-flabel="${i}" value="${esc(f.label)}" placeholder="項目名（質問文）" style="flex:1;margin:0">
  </div>
  <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
   <select class="inp" data-ftype="${i}" style="width:auto;margin:0">${Object.entries(TYPE_NAMES).map(([t,n])=>`<option value="${t}" ${f.type===t?"selected":""}>${n}</option>`).join("")}</select>
   <span class="chip f-req ${f.req?"on":""}" data-i="${i}">必須</span>
   <span class="chip" data-fup="${i}">↑</span><span class="chip" data-fdn="${i}">↓</span>
   <span class="chip" data-fdel="${i}" style="color:var(--red)">削除</span></div>
  <input type="text" data-fopts="${i}" value="${esc((f.opts||[]).join("、"))}" placeholder="選択肢を「、」区切りで入力（例: 良い、普通、悪い）" style="margin:8px 0 0;font-size:13px;display:${OPT_TYPES.includes(f.type)?"":"none"}">
  </div>`).join("");
 h+=`<button class="btn sm sub" id="f-add">＋ 項目を追加</button>
  <button class="btn" id="f-save" style="margin-top:12px">この内容で保存する</button>
  <button class="btn sub" id="f-reset">標準の項目に戻す</button>`;
 return h;
}
function collectFmtDom(){
 const list=curFmtList();
 document.querySelectorAll("input[data-flabel]").forEach(inp=>list[+inp.dataset.flabel].label=inp.value.trim());
 document.querySelectorAll("select[data-ftype]").forEach(s=>list[+s.dataset.ftype].type=s.value);
 document.querySelectorAll("input[data-fopts]").forEach(inp=>{
  const v=inp.value.trim();list[+inp.dataset.fopts].opts=v?v.split(/[、,]/).map(x=>x.trim()).filter(Boolean):[];
 });
 document.querySelectorAll(".chip.f-req").forEach(c=>list[+c.dataset.i].req=c.classList.contains("on"));
}
async function saveFmt(){
 collectFmtDom();
 let list=curFmtList().filter(f=>f.label);
 for(const [i,f] of list.entries()){
  if(!f.k)f.k="c"+i+Date.now().toString(36);
  if(OPT_TYPES.includes(f.type)&&(!f.opts||!f.opts.length)){
   toast(`「${f.label}」に選択肢を入力してください（「、」区切り）`,true);return}
 }
 cfgFmts[fmtRole]=list;
 $("f-save").disabled=true;
 const merged={...(appSettings.formats||{}),...cfgFmts};
 const {error}=await sb.from("app_settings").upsert({key:"formats",value:merged,updated_at:new Date().toISOString(),updated_by:me.id});
 if(error){toast("保存エラー: "+error.message,true);$("f-save").disabled=false;return}
 appSettings.formats=merged;
 toast("保存しました");render();
}
async function resetFmt(){
 const merged={...(appSettings.formats||{})};
 delete merged[fmtRole];
 const {error}=await sb.from("app_settings").upsert({key:"formats",value:merged,updated_at:new Date().toISOString(),updated_by:me.id});
 if(error){toast("エラー: "+error.message,true);return}
 appSettings.formats=merged;
 delete cfgFmts[fmtRole];
 toast("標準の項目に戻しました");render();
}

 document.querySelectorAll(".chip.eustore").forEach(c=>c.onclick=()=>{const s=c.dataset.s;euStores=euStores.includes(s)?euStores.filter(x=>x!==s):euStores.concat([s]);c.classList.toggle("on")});
 if($("nu-gen"))$("nu-gen").onclick=()=>{$("nu-pw").value=genPw()};
 if($("nu-submit"))$("nu-submit").onclick=adminCreate;
 if($("eu-save"))$("eu-save").onclick=adminSave;
 if($("eu-setpw"))$("eu-setpw").onclick=adminSetPw;
 if($("eu-smaregi"))$("eu-smaregi").onclick=async()=>{
  $("eu-smaregi").disabled=true;$("eu-smaregi").textContent="同期中...";
  const r=await smaregiSync(adminDetail);
  if(r&&r.ok)toast("スマレジに登録しました（スタッフID: "+r.staffId+"）");
  else toast("同期エラー: "+((r&&(r.error&&r.error.title||JSON.stringify(r.error)))||"不明"),true);
  render();
 };
 if($("eu-toggle"))$("eu-toggle").onclick=adminToggle;
 // v2.6.8 退職日
 const saveTerm=async(d)=>{
  const btn=$(d?"eu-termsave":"eu-termclear");if(btn)btn.disabled=true;
  const {data,error}=await sb.rpc("set_employee_termination",{p_user:adminDetail,p_date:d});
  if(error){toast("保存エラー: "+error.message,true);if(btn)btn.disabled=false;return}
  let sm="";
  try{
   const r=await smaregiTerminate(adminDetail,d);
   sm=r&&r.ok?(r.skipped?"（スマレジは未連携）":"／スマレジにも反映しました"):"／スマレジ反映に失敗（後で再実行してください）";
  }catch(e){sm="／スマレジ反映に失敗"}
  const apps=(data&&data.applicants)||0;
  toast(d?`退職日を保存しました${apps?"／応募者の状況を退職に更新":""}${sm}`:`退職を取り消しました${sm}`);
  adminMode="list";adminDetail=null;adminUsers=null;rcList=null;rcHiredInfo=null;render();
 };
 if($("eu-termsave"))$("eu-termsave").onclick=()=>{
  const d=$("eu-term").value;
  if(!d){toast("退職日を選んでください",true);return}
  if(!confirm(`退職日を ${d} に設定します。\n\n・アカウントが使えなくなります\n・スマレジ・タイムカードにも登録され、打刻できなくなります\n・応募者管理の状況が「退職」になります\n\nよろしいですか？`))return;
  saveTerm(d);
 };
 if($("eu-termclear"))$("eu-termclear").onclick=()=>{
  if(!confirm("退職を取り消して、アカウントを使える状態に戻します。よろしいですか？"))return;
  saveTerm(null);
 };
 // v2.6.0 完全削除
 if($("eu-del"))$("eu-del").onclick=async()=>{
  const {data:info,error}=await sb.rpc("delete_user_completely",{p_user:adminDetail,p_confirm:false});
  if(error){toast("エラー: "+error.message,true);return}
  const n=[["日報",info.reports],["フィードバック",info.comments],["タスク",info.tasks],["タスクのコメント",info.task_comments],["チャット発言",info.messages],["添付ファイル",info.files]].filter(x=>x[1]>0);
  const detail=n.length?"\n\n一緒に削除されるもの:\n"+n.map(x=>`・${x[0]} ${x[1]}件`).join("\n"):"\n\n（関連データはありません）";
  if(!confirm(`${info.name}さんを完全に削除します。元に戻せません。${detail}\n\n本当に削除しますか？`))return;
  if(n.length&&!confirm(`最終確認です。\n${info.name}さんの記録もすべて消えます。よろしいですか？`))return;
  $("eu-del").disabled=true;
  const {data:res,error:e2}=await sb.rpc("delete_user_completely",{p_user:adminDetail,p_confirm:true});
  if(e2){toast("削除エラー: "+e2.message,true);$("eu-del").disabled=false;return}
  toast(`${(res&&res.name)||""}さんを完全に削除しました`);
  adminMode="list";adminDetail=null;adminUsers=null;render();
 };
 // v2.6.0 従業員の絞り込み
 ["au-role","au-state","au-store"].forEach(id=>{if($(id))$(id).onchange=()=>{auRole=$("au-role").value;auState=$("au-state").value;auStore=$("au-store").value;render()}});
 if($("au-clear"))$("au-clear").onclick=()=>{auRole="";auState="";auStore="";render()};
 // v2.6.0 プロフィール
 if($("pf-save"))$("pf-save").onclick=async()=>{
  const name=$("pf-name").value.trim();
  if(!name){toast("氏名を入力してください",true);return}
  $("pf-save").disabled=true;
  const {error}=await sb.rpc("update_my_profile",{p_name:name,p_name_kana:$("pf-kana").value.trim()||null,
   p_phone:$("pf-phone").value.trim()||null,p_postal_code:$("pf-zip").value.trim()||null,p_address:$("pf-addr").value.trim()||null,
   p_emergency_name:$("pf-ename").value.trim()||null,p_emergency_relation:$("pf-erel").value.trim()||null,p_emergency_phone:$("pf-ephone").value.trim()||null});
  $("pf-save").disabled=false;
  if(error){toast("保存エラー: "+error.message,true);return}
  me.name=name;myProf=null;toast("プロフィールを保存しました");render();
 };
 if($("pf-pwsave"))$("pf-pwsave").onclick=async()=>{
  const pw=$("pf-pw").value,pw2=$("pf-pw2").value;
  if(pw.length<8){toast("パスワードは8文字以上にしてください",true);return}
  if(pw!==pw2){toast("確認用のパスワードが一致しません",true);return}
  $("pf-pwsave").disabled=true;
  const {error}=await sb.auth.updateUser({password:pw});
  $("pf-pwsave").disabled=false;
  if(error){toast("変更エラー: "+error.message,true);return}
  $("pf-pw").value="";$("pf-pw2").value="";toast("パスワードを変更しました");
 };
 if($("editthis"))$("editthis").onclick=async()=>{
  const {data:r}=await sb.from("reports").select("kind").eq("id",detail).single();
  editId=detail;detail=null;page=r&&r.kind==="weekly"?"weekly":"write";render();
 };
}

// v2.5.6 未読バッジの自動更新（新しい応募・通知を画面を切り替えなくても反映）
setInterval(()=>{if(me&&document.getElementById("nav").style.display!=="none")updateDots()},60000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&me)updateDots()});

// セッション切れ対応
sb.auth.onAuthStateChange((ev)=>{if(ev==="SIGNED_OUT"){me=null;renderLogin()}});
init();
