<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>退職申請フォーム</title>
<style>
:root{--bg:#faf8f4;--card:#fff;--ink:#2b2f36;--muted:#8a8f98;--line:#dfe2e6;--btn:#48586a;--err:#c0392b;--ok:#2e7d4f}
@media (prefers-color-scheme:dark){:root{--bg:#1b1d21;--card:#25282d;--ink:#eceef1;--muted:#9aa0a8;--line:#3a3e45;--btn:#5d7186;--err:#ff8a7a;--ok:#6fcf97}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;padding:16px}
.wrap{max-width:460px;margin:24px auto}
.card{background:var(--card);border-radius:16px;box-shadow:0 1px 8px rgba(0,0,0,.08);padding:18px}
h1{font-size:16px;margin:0 0 6px}
.sub{font-size:11.5px;color:var(--muted);margin:0 0 14px;line-height:1.6}
label{display:block;font-size:11.5px;color:var(--muted);margin:12px 0 4px}
input,select,textarea{width:100%;font-size:16px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font-family:inherit}
textarea{min-height:64px;resize:vertical}
button{width:100%;margin-top:18px;padding:11px;border:0;border-radius:8px;background:var(--btn);color:#fff;font-size:15px;cursor:pointer;font-family:inherit}
button:disabled{opacity:.5;cursor:default}
button.ghost{background:transparent;color:var(--btn);border:1px solid var(--btn)}
.msg{font-size:13px;margin-top:10px;min-height:18px}
.msg.err{color:var(--err)}
.done{text-align:center;padding:10px 0}
.done b{display:block;font-size:17px;color:var(--ok);margin-bottom:8px}
.note{font-size:11.5px;color:var(--muted);margin-top:4px;line-height:1.6}
</style>
</head>
<body>
<div class="wrap"><div class="card" id="app"><p class="sub">読み込み中…</p></div></div>
<script>
const SUPA_URL="https://uuvsxzhpxtghojoubjcc.supabase.co";
const SUPA_KEY="sb_publishable_MrwPJAx_Ws_fdRutprKCiQ_dg3wCiTr"; // 公開用キー（nippo本体と同じ）。権限は合言葉つきのDB関数側で守る
const TOKEN=new URLSearchParams(location.search).get("k")||"";
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const todayJst=()=>new Date(Date.now()+9*3600e3).toISOString().slice(0,10); // 日本時間の今日
const minDate=()=>{const x=new Date(Date.now()+9*3600e3-30*864e5);return x.toISOString().slice(0,10)}; // 30日前から選べる
let opts=null;
async function rpc(name,args){
  const r=await fetch(SUPA_URL+"/rest/v1/rpc/"+name,{method:"POST",headers:{apikey:SUPA_KEY,Authorization:"Bearer "+SUPA_KEY,"Content-Type":"application/json"},body:JSON.stringify(args)});
  let b=null;try{b=await r.json()}catch(e){}
  if(!r.ok)throw new Error((b&&b.message)||"通信に失敗しました");
  return b;
}
function memberOptions(storeId){
  const ms=(opts.members||[]).filter(m=>m.store_id===storeId);
  return `<option value="">（従業員を選択）</option>`+ms.map(m=>`<option value="${esc(m.id)}">${esc(m.name)}</option>`).join("");
}
function render(){
  $("app").innerHTML=`<h1>🚪 退職申請</h1>
  <p class="sub">退職する方の情報を入力して送信してください。送信後は本部が確認してから退職日が登録されます（送っただけでは何も変わりません）。すでに退職した方は、過去の退職日（30日前まで）も選べます。</p>
  <label>退職日</label><input type="date" id="f-date" min="${minDate()}">
  <label>店舗</label><select id="f-store"><option value="">（店舗を選択）</option>${(opts.stores||[]).map(s=>`<option value="${esc(s.id)}">${esc(s.name)}</option>`).join("")}</select>
  <label>従業員</label><select id="f-user" disabled><option value="">（先に店舗を選択）</option></select>
  <label>申請する人のお名前</label><input id="f-req" maxlength="30" placeholder="例: 山田 太郎（店長）">
  <label>備考（任意）</label><textarea id="f-note" maxlength="200" placeholder="例: 一身上の都合"></textarea>
  <div class="msg err" id="f-msg"></div>
  <button id="f-send">送信</button>`;
  $("f-store").onchange=()=>{const v=$("f-store").value;const u=$("f-user");u.disabled=!v;u.innerHTML=v?memberOptions(v):`<option value="">（先に店舗を選択）</option>`};
  $("f-send").onclick=send;
}
async function send(){
  const date=$("f-date").value,store=$("f-store").value,user=$("f-user").value,req=$("f-req").value.trim(),note=$("f-note").value.trim();
  const m=$("f-msg");m.className="msg err";m.textContent="";
  if(!date){m.textContent="退職日を選んでください";return}
  if(!store){m.textContent="店舗を選んでください";return}
  if(!user){m.textContent="従業員を選んでください";return}
  if(!req){m.textContent="申請する人のお名前を入力してください";return}
  const uname=$("f-user").selectedOptions[0].textContent;
  const past=date<todayJst()?"\n※退職日が過去のため、本部が承認するとすぐにログインと打刻が止まります。":"";
  if(!confirm(`${uname}さんの退職申請を送ります（退職日 ${date.replace(/-/g,"/")}）。${past}\nよろしいですか？`))return;
  const b=$("f-send");b.disabled=true;b.textContent="送信中…";
  try{
    await rpc("hr_public_request_retirement",{p_token:TOKEN,p_store:store,p_user:user,p_date:date,p_requester:req,p_note:note||null});
    $("app").innerHTML=`<div class="done"><b>✅ 送信しました</b><p class="sub" style="margin:0 0 6px">${esc(uname)}さんの退職申請を本部へ送りました。<br>本部が確認して、退職日が登録されます。</p>
      <button id="f-again" class="ghost">続けてもう1件申請する</button></div>`;
    $("f-again").onclick=async()=>{try{opts=await rpc("hr_public_retire_options",{p_token:TOKEN})}catch(e){}render()};
  }catch(e){
    b.disabled=false;b.textContent="送信";m.textContent=e.message;
  }
}
(async()=>{
  if(!TOKEN){$("app").innerHTML=`<h1>🚪 退職申請</h1><p class="sub">このURLでは開けません。本部から受け取ったURLをそのまま開いてください。</p>`;return}
  try{opts=await rpc("hr_public_retire_options",{p_token:TOKEN});render()}
  catch(e){$("app").innerHTML=`<h1>🚪 退職申請</h1><p class="sub" style="color:var(--err)">${esc(e.message)}</p>`}
})();
</script>
</body>
</html>
